  - id: validate-alpha-diversity
    title: 实跑并验证第 19 篇 Alpha 指数、稀释曲线与 Hill numbers 合同
    cache_revision: article-19-alpha-diversity-v1
    goal: >
      从 checksum-locked 的真实湿地 otutab、taxonomy、metadata 三件套开始，
      逐样本计算 library size、singleton/doubleton、observed、Chao1、Shannon、
      Simpson、Pielou 与 Hill q=0/1/2；分别执行 10,000 reads 等样本量和
      0.90 等 coverage 的 iNEXT 标准化，保留 rarefaction/extrapolation 方法标签、
      隐含测序量与排序稳定性，并重绘四张英文出版图。
    rationale: >
      Alpha diversity 同时受真实群落结构、测序量、样本完整度和低频 feature
      质量影响。只报一个 Shannon 值会掩盖这些测量层；把随机抽平用于所有后续
      分析又会丢失信息。发布前必须把 raw 描述、等 reads 比较、等 coverage
      比较和 Hill 数的稀有度权重拆成可审计的并行结果，而不是混成一个“标准答案”。
    inputs:
      - env/renv.lock
      - data/small/otutab.tsv
