  - id: validate-environment-variance
    title: 实跑并验证第 25 篇 envfit、Mantel 与 VPA 变异分解合同
    cache_revision: article-25-environment-variance-v1
    goal: >
      从 microeco 2.0.0 分发的真实中国湿地 16S otutab、taxonomy、metadata
      三件套与 environment 表独立开始，预先固定 5% prevalence filter、
      relative-abundance Bray-Curtis、Hellinger transformation、三个环境距离块、
      两个 VPA predictor sets、seed 20260725 和一张 999-row free-permutation matrix。
      分别运行二维 PCoA envfit、三项 Spearman Mantel family、非主分析的 Pearson
      partial Mantel sensitivity、adjusted-R2 variation partitioning、两个 pure-fraction
      partial RDA tests、VIF、conditioning 与 prevalence sensitivity branches。
    rationale: >
      envfit r2、Mantel r 与 VPA adjusted R2 回答不同问题，不能互换为“解释率”。
      环境协变量高度相关、Group 与 Saline 完全混杂、共享 VPA fraction 不可直接检验，
      因而必须把变量集合、multiplicity、置换边界、可检验组分和因果解释边界分别审计。
    inputs:
      - env/renv.lock
      - data/small/otutab.tsv
      - data/small/taxonomy.tsv
      - data/small/metadata.tsv
      - data/small/environment.tsv
      - data/small/source_summary.json
      - R/theme_pub.R
      - scripts/prepare_pilot_data.R
      - scripts/validate_environment_variance.R
      - chapters/25-environment-variance.qmd
    command: |
      set -eu
      mkdir -p \
        "${RUN_ROOT}/results/25-environment-variance" \
        "${RUN_ROOT}/figures"
      Rscript --vanilla "${MANIFEST_DIR}/scripts/validate_environment_variance.R" \
        --project-root "${MANIFEST_DIR}" \
        --input-dir "${MANIFEST_DIR}/data/small" \
        --output-dir "${RUN_ROOT}/results/25-environment-variance" \
        --figure-dir "${RUN_ROOT}/figures"
    expected_outputs:
      - results/25-environment-variance/environment-variance-summary.json
      - results/25-environment-variance/input-audit.tsv
      - results/25-environment-variance/package-audit.tsv
      - results/25-environment-variance/command-audit.tsv
      - results/25-environment-variance/font-audit.tsv
      - results/25-environment-variance/sample-alignment-audit.tsv
      - results/25-environment-variance/environmental-variable-audit.tsv
      - results/25-environment-variance/environmental-correlation.tsv
      - results/25-environment-variance/high-correlation-pairs.tsv
      - results/25-environment-variance/permutation-audit.tsv
      - results/25-environment-variance/pcoa-scores.tsv
      - results/25-environment-variance/envfit-results.tsv
      - results/25-environment-variance/mantel-results.tsv
      - results/25-environment-variance/partial-mantel-sensitivity.tsv
      - results/25-environment-variance/variation-partition.tsv
      - results/25-environment-variance/variation-fraction-tests.tsv
      - results/25-environment-variance/vif-audit.tsv
      - results/25-environment-variance/conditioning-sensitivity.tsv
      - results/25-environment-variance/prevalence-sensitivity.tsv
      - results/25-environment-variance/figure-specification.tsv
      - results/25-environment-variance/format-audit.tsv
      - results/25-environment-variance/validation-checks.tsv
      - results/25-environment-variance/r-session-info.txt
      - results/25-environment-variance/validation.log
      - figures/25-environment-correlation.pdf
      - figures/25-environment-correlation.svg
      - figures/25-environment-correlation.png
      - figures/25-environment-correlation.tiff
      - figures/25-envfit-pcoa.pdf
      - figures/25-envfit-pcoa.svg
      - figures/25-envfit-pcoa.png
      - figures/25-envfit-pcoa.tiff
      - figures/25-mantel-distance-blocks.pdf
      - figures/25-mantel-distance-blocks.svg
      - figures/25-mantel-distance-blocks.png
      - figures/25-mantel-distance-blocks.tiff
      - figures/25-variation-partition.pdf
      - figures/25-variation-partition.svg
      - figures/25-variation-partition.png
      - figures/25-variation-partition.tiff
    acceptance_checks:
      - 四张数据表、来源摘要、准备脚本和共享作图函数逐文件 SHA-256 全部锁定；三件套为 13,628 features、90 samples、1,619,670 reads，环境源表 200 行且 90 个共同样本按相同顺序对齐
      - 11 个环境变量均为有限数值且无零方差；高相关阈值预设为 abs(r) >= 0.80，必须检出 4 对，其中 TOC 与 TN 的 Pearson r 为 0.9880
      - metadata 中 Group 与 Saline 完全混杂，且没有 SubjectID、PairID、Block、SiteID、Time 或 Batch；示例只能采用自由置换并明确这不是对真实样本独立性的额外证明
      - seed 20260725 生成 999 个唯一、合法、非恒等 free permutations，重复生成矩阵必须完全相同，最低 Monte Carlo P 为 0.001
      - 主分支保留至少 5/90 个样本检出的 feature，共 11,113 个；envfit/Mantel 使用 relative-abundance Bray-Curtis，VPA 使用 Hellinger community matrix
      - envfit 同时检验全部 11 个标准化连续变量并在一个 family 内做 BH 校正；TwoAxisR2 只解释与两轴 PCoA configuration 的关联，图上只标注校正后显著变量中的前 7 个
      - Mantel 主 family 预先固定 edaphic、climate 与 Haversine geographic 三个距离块，使用 Spearman statistic、同一置换矩阵和 Holm 校正；三项 r 分别约为 0.332、0.395、0.587
      - Pearson partial Mantel 仅作为 edaphic given geographic sensitivity 保存，必须标记 PrimaryInference 为 false，不得用来声称排除空间混杂或确认因果
      - VPA 使用五变量 edaphic set 与三水平 wetland Group；combined adjusted R2 为 0.2817，pure edaphic、pure group、shared 与 unexplained fractions 分别约为 0.0967、0.1140、0.0710、0.7183
      - 只有两个 pure fractions 进入 partial RDA permutation tests 并在同一 family 内做 Holm 校正；shared fraction 与 unexplained fraction 必须标记为不可直接检验，combined-model maximum VIF 小于 5
      - sensitivity table 同时展示 0%、5%、10%、20% prevalence branches 与 none/salinity/group conditioning；不得从敏感性分支中按最小 P 或最大 R2 反选主结论
      - 四张英文原创图各导出 PDF/SVG/600 ppi PNG/LZW-TIFF，并通过物理尺寸、像素、字体、SVG 文本与 TIFF 压缩审计
    common_failures:
      - 把 envfit r2、Mantel r 和 VPA adjusted R2 当成同一种 explained variance
      - 环境变量数很多却只报告原始 P，或只保留图上显著箭头而丢失完整检验族
      - 未标准化不同单位的环境变量就直接计算 Euclidean distance
      - 把 partial Mantel 写成可靠的空间混杂控制或因果调整
      - 把 VPA shared fraction 归因给某一组预测变量，或对它直接报告置换 P
      - 将 TOC、TN 等近重复变量同时填入集合，导致冗余解释和不稳定系数
      - 忽略 Group 与 Saline 完全混杂，误写成盐度的独立贡献
      - 有配对、区组、地点或纵向层级时仍沿用自由置换
    outputs:
      - results/25-environment-variance/environment-variance-summary.json
      - results/25-environment-variance/environmental-correlation.tsv
      - results/25-environment-variance/envfit-results.tsv
      - results/25-environment-variance/mantel-results.tsv
      - results/25-environment-variance/partial-mantel-sensitivity.tsv
      - results/25-environment-variance/variation-partition.tsv
      - results/25-environment-variance/variation-fraction-tests.tsv
      - results/25-environment-variance/prevalence-sensitivity.tsv
      - results/25-environment-variance/conditioning-sensitivity.tsv
      - results/25-environment-variance/validation.log
      - figures/25-environment-correlation.png
      - figures/25-envfit-pcoa.png
      - figures/25-mantel-distance-blocks.png
      - figures/25-variation-partition.png
    method_basis:
      type: external-benchmark
      summary: >
        以 Falony et al. 的多协变量群落变异框架为论文锚点，用公开中国湿地 16S
        四表重绘环境相关性、envfit、Mantel 和 adjusted VPA；统计实现严格区分
        two-axis association、distance correlation 与 multivariate variation fraction。
    references:
      - title: Population-level analysis of gut microbiome variation
        type: benchmark-paper
        citation: Falony G, Joossens M, Vieira-Silva S, et al. Science. 2016;352:560-564. doi:10.1126/science.aad3503.
