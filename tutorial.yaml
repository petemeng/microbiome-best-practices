  advanced_directions:
    - title: 设计特异的效力模拟与伪重复审计
      rationale: >
        连续终点的 t 检验曲线不能替代 PERMANOVA、差异丰度、纵向混合模型或
        分类性能的设计特异模拟；所有计算必须使用独立实验单位而非样本管数。
      references:
        - title: Power and sample-size estimation for microbiome studies using pairwise distances and PERMANOVA
          type: method-paper
          citation: Kelly BJ, Gross R, Bittinger K, et al. Bioinformatics. 2015;31(15):2461-2468.
    - title: 成分数据排序与 Robust Aitchison
      rationale: >
        Bray-Curtis PCoA 之外，需要用 CLR/Aitchison 与 robust PCA 检查结论是否受组成约束和零值处理影响。
      references:
        - title: The statistical analysis of compositional data
          type: method-paper
          citation: Aitchison J. Journal of the Royal Statistical Society Series B. 1982;44(2):139-177.
    - title: PERMANOVA 与离散度配套验证
      rationale: >
        组间中心差异必须与组内离散度差异区分，不能只凭排序图或单一 P 值解释。
      references:
        - title: Distance-based tests for homogeneity of multivariate dispersions
          type: method-paper
          citation: Anderson MJ. Biometrics. 2006;62(1):245-253.
    - title: 约束排序的模型复杂度与校正解释率
      rationale: >
        多环境变量模型需要控制共线性、变量数量和过拟合，并报告校正后的解释率与置换证据。
      references:
        - title: "Canonical analysis of principal coordinates: a useful method of constrained ordination for ecology"
          type: method-paper
          citation: Anderson MJ, Willis TJ. Ecology. 2003;84(2):511-525.
steps:
  - id: prepare-pilot-data
    title: 从 microeco 源码包导出标准三件套、环境表与根树
    goal: >
      从经过校验的 CRAN 源码包导出 otutab、taxonomy、metadata、environment 和 rooted phylogeny，
      并生成机器可读的数据摘要。
    rationale: >
      直接从版本锁定包数据生成文本表，既保留真实数据出处，又避免依赖本机已安装包，
      让使用 microeco 数据的正式文章可以从同一组公开输入独立复现。
    inputs:
      - downloads/microeco_2.0.0.tar.gz
      - scripts/prepare_pilot_data.R
    command: |
      set -eu
      mkdir -p data/small results
      Rscript "${MANIFEST_DIR}/scripts/prepare_pilot_data.R" \
        "${RUN_ROOT}/downloads/microeco_2.0.0.tar.gz" \
        "${RUN_ROOT}/data/small" \
        "${RUN_ROOT}/results/data_summary.json"
    expected_outputs:
      - data/small/otutab.tsv
      - data/small/taxonomy.tsv
      - data/small/metadata.tsv
      - data/small/environment.tsv
      - data/small/rooted-tree.nwk.gz
      - results/data_summary.json
    acceptance_checks:
      - otutab 为 13,628 个 OTU × 90 个样本
      - taxonomy 与 otutab 的 OTU ID 完全一致
      - metadata 包含 90 个样本，environment 包含 200 行观测和 11 个变量
      - rooted tree 有 14,096 tips、14,095 internal nodes，包含全部 13,628 个 count-table OTU
    common_failures:
      - 源码包版本与校验值不一致
      - RData 对象名变化或导出后行名丢失
      - 文本表写出时样本列顺序发生漂移
    outputs:
      - results/data_summary.json
      - data/small/otutab.tsv
      - data/small/rooted-tree.nwk.gz
    method_basis:
      type: external-benchmark
      summary: microeco 发布包提供真实且可引用的 16S 与环境数据，适合排序方法的独立演示。
    references:
      - title: "microeco: an R package for data mining in microbial community ecology"
        type: method-paper
        citation: Liu C, Cui Y, Li X, Yao M. FEMS Microbiology Ecology. 2021;97(2):fiaa255.
    assertions:
      - id: pilot-data-summary-exists
        type: file_exists
        path: results/data_summary.json
      - id: pilot-sample-count
        type: metric_threshold
        path: results/data_summary.json
        key: samples
        comparator: "=="
        value: 90
  - id: prepare-contamination-data
    title: 从 decontam 官方对象导出污染控制三件套
    goal: >
      从版本锁定的 decontam 1.24.0 中读取 MUClite.rds，核对对象 SHA-256，
      并导出包含阴性对照、DNA 定量与实验板信息的标准三件套。
    rationale: >
      污染识别不能从不含 blank 或 DNA 浓度的普通群落表硬推断。MUClite 提供真实口腔
      16S ASV、539 个生物样本和 30 个阴性对照，能够完整复现 frequency、
      prevalence、combined 与按板敏感性分析。
    inputs:
      - env/renv.lock
      - scripts/prepare_decontam_data.R
      - decontam 1.24.0 extdata/MUClite.rds
    command: |
      set -eu
      mkdir -p data/small/decontam results
