      - figures/15-holdout-rank-performance.png
      - figures/15-holdout-rank-performance.tiff
      - figures/15-query-confidence-sensitivity.pdf
      - figures/15-query-confidence-sensitivity.png
      - figures/15-query-confidence-sensitivity.tiff
      - figures/15-method-concordance.pdf
      - figures/15-method-concordance.png
      - figures/15-method-concordance.tiff
    acceptance_checks:
      - SILVA 138.2 V4 FASTA、taxonomy、query FASTA 与 abundance 均通过固定 SHA-256 和 ID 对齐审计
      - 262,752 条 unique V4 LCA reference 按完整 genus-lineage 和固定 SHA-256 顺序分层为 236,516 条 training 与 26,236 条 holdout，split 无 ID/序列交叉
      - 每个进入 holdout 的 genus-lineage 至少保留一条 training 记录；singleton lineage 只进入 training
      - 内部留出集明确标记为同一 SILVA release 的 known-lineage interpolation，不作为独立 mock-community 或跨 release 准确率
      - holdout classifier 在 QIIME 2/q2-feature-classifier 2026.4.0、scikit-learn 1.7.1 中使用默认 7-mer hashed Naive Bayes 合同实际训练
      - production classifier 使用全部 262,752 条 region-specific reference 重新训练，不把缺少 10% reference 的验证模型交付为生产模型
      - holdout 与 366 个真实 query ASV 均固定 same orientation、20,000 reads/batch、4 jobs，并分别测试 confidence 0.50、0.70、0.90
      - holdout 从 domain 到 genus 分别报告 precision、recall、F1、correct、incorrect 与 abstained，且保存 QIIME quality-control evaluation
      - 真实 query 分别报告 ASV 加权和 read 加权 rank coverage；consensus-VSEARCH comparator 在本篇内从相同 reference 重新计算，exact-name concordance 只解释为方法敏感性
      - 两个 classifier、六个 classification Artifact 与 evaluation Visualization 全部通过 maximum validation，provenance 能回查 fit/classify/evaluate action 和软件版本
      - 四张英文证据图同时导出 PDF、PNG 与 350 dpi LZW TIFF
    common_failures:
      - 直接下载文件名相近但 scikit-learn 版本不兼容的旧 classifier
      - 用全长 reference 训练，却把短 V4 query 的更深标签当作区域匹配证据
      - 随机拆分后让相同序列同时进入 train/test，或不保存 split membership
      - 把同一 release 的内部 holdout F1 写成真实样本的外部准确率
      - 只报告 confidence 0.70，不展示阈值升高导致的 precision/recall/coverage 权衡
      - 把 sequence-search 与 Naive Bayes 的一致性当作二者共同正确
      - 用验证集训练剩余模型直接作为生产 classifier，不在评估后用全库重训
      - 只导出 taxonomy.tsv，不保存 classifier、Artifact validation、训练参数和 provenance
    outputs:
      - results/15-train-classifier/classifier-training-summary.json
      - results/15-train-classifier/reference-split-audit.tsv
      - results/15-train-classifier/holdout-rank-metrics.tsv
      - results/15-train-classifier/holdout-confidence-summary.tsv
      - results/15-train-classifier/query-rank-coverage.tsv
      - results/15-train-classifier/query-method-concordance.tsv
      - results/15-train-classifier/query-taxonomy-crosswalk.tsv
      - results/15-train-classifier/silva-v4-classifier.qza
      - results/15-train-classifier/provenance-audit.tsv
      - results/15-train-classifier/validation.log
      - figures/15-classifier-build-contract.png
      - figures/15-holdout-rank-performance.png
      - figures/15-query-confidence-sensitivity.png
      - figures/15-method-concordance.png
    method_basis:
      type: project-experience
      summary: >
        对 checksum-locked SILVA V4 LCA reference 建立确定性 known-lineage
        holdout，实际训练并校验当前环境 classifier，完成 confidence sensitivity
        后再使用全库重训生产模型；把内部准确率和真实 ASV 方法一致性严格分开。
