  - id: validate-community-composition
    title: 实跑并验证第 26 篇堆叠、气泡、冲积与热图组成合同
    cache_revision: article-26-community-composition-v1
    goal: >
      从 microeco 2.0.0 分发的真实中国湿地 16S otutab、taxonomy、metadata
      三件套独立开始，逐样本闭合到 100%，按等样本均值选择门水平 Top 10，
      将 Unknown 与 Other known 明确分离，并生成全样本堆叠图、属水平丰度/检出率
      气泡图、组均值冲积图与样本级属热图。同步审计七级 taxonomy completeness、
      Top-N coverage、equal-sample vs pooled-read weighting、all-read vs known-only
      denominator，以及四格式出版导出。
    rationale: >
      群落组成图看似只是绘图，但分类层级、分母、样本权重、Top-N 和 unknown
      处理都会改变视觉结论。把这些选择固定成可执行合同，才能让描述性图忠实反映
      数据，并阻止把相对丰度、冲积 ribbon 或热图聚类误写成绝对变化、迁移或推断证据。
    inputs:
      - env/renv.lock
      - data/small/otutab.tsv
      - data/small/taxonomy.tsv
      - data/small/metadata.tsv
      - data/small/source_summary.json
      - R/theme_pub.R
      - scripts/prepare_pilot_data.R
      - scripts/validate_community_composition.R
      - chapters/26-community-composition.qmd
