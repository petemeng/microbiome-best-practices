  - id: validate-phyloseq-import
    title: 实跑并验证第 17 篇 QIIME 2 导出与五组件 phyloseq 对象
    cache_revision: article-17-phyloseq-input-v1
    goal: >
      从独立冻结且逐文件 SHA-256 固定的真实 otutab、taxonomy、metadata 三件套开始，
      同时读取 366 条代表序列和完整 203,818-tip SEPP rooted insertion tree；在 R 中
      显式核对 feature/sample 方向、唯一性和跨组件 ID，再按 366 个 ASV 修剪完整树，
      构建含 otu_table、tax_table、sample_data、phy_tree、refseq 的 phyloseq 对象，
      保存并回读 RDS，生成四张英文审计图和机器可读结果。
    rationale: >
      phyloseq 构造器会按组件交集保持内部一致性，但“对象成功生成”不能证明方向正确，
      也不能证明缺失 ID 是预期过滤还是静默丢失；因此交集之前必须先做集合与计数审计。
      完整 SEPP 树含 reference-only tips，本篇必须从完整树显式修剪，而不能把诊断性
      query-only tree 或上一章 RDS 当作隐藏输入。
    inputs:
      - env/renv.lock
      - data/small/phyloseq-import/otutab.tsv
      - data/small/phyloseq-import/taxonomy.tsv
      - data/small/phyloseq-import/metadata.tsv
