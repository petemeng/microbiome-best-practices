  - id: validate-region-specific-classifier
    title: 一次性训练并评估第 15 篇 SILVA V4 Naive Bayes 分类器
    cache_revision: article-15-region-classifier-v2
    goal: >
      使用第 14 篇锁定的 SILVA 138.2 SSURef NR99 515F/806R unique-V4
      LCA reference，在当前 QIIME 2/q2-feature-classifier 2026.4.0 与
      scikit-learn 1.7.1 环境中实际训练 region-specific Naive Bayes
      classifier。先按 genus-lineage 分层和固定 SHA-256 顺序建立无重复的
      236,516/26,236 training/holdout 内部验证集，在 confidence 0.50、
      0.70、0.90 下计算 domain 到 genus 的 precision、recall、F1 与
      abstention；再用全部 262,752 条参考重训生产 classifier，并注释同一组
      366 个真实 V4 ASV，在本篇内用相同区域 reference 重新运行
      consensus-VSEARCH comparator，审计 confidence sensitivity、
      exact-name concordance、Artifact compatibility 和完整 provenance。
    rationale: >
      预训练 sklearn classifier 的可执行性同时取决于 marker region、reference
      release、taxonomy contract、训练参数和 scikit-learn 序列化版本。区域裁剪
      可以让模型只学习实验真实可见的 k-mer，但同一 reference release 内的留出
      评估仍可能乐观，不能替代独立 mock community 或跨 release 验证。因此本篇
      把内部 interpolation、真实 ASV 方法一致性和生产全库重训分开报告。
    inputs:
      - env/qiime2.yml
      - data/small/taxonomy-databases/query-v4-asvs.fasta.gz
      - data/small/taxonomy-databases/query-v4-asv-abundance.tsv
      - data/small/taxonomy-databases/query-source-summary.json
      - data/small/taxonomy-databases/silva-138.2-source-summary.json
      - data/small/taxonomy-databases/silva-138.2-v4.fasta.gz
      - data/small/taxonomy-databases/silva-138.2-v4-taxonomy.tsv.gz
      - scripts/validate_region_classifier.py
    command: |
      set -eu
      mkdir -p \
        "${RUN_ROOT}/results/15-train-classifier" \
        "${RUN_ROOT}/figures"
      python3 "${MANIFEST_DIR}/scripts/validate_region_classifier.py" \
        --project-root "${MANIFEST_DIR}" \
        --output-dir "${RUN_ROOT}/results/15-train-classifier" \
        --figure-dir "${RUN_ROOT}/figures" \
        --qiime-env microbiome-qiime2-2026.4
    expected_outputs:
      - results/15-train-classifier/classifier-training-summary.json
      - results/15-train-classifier/environment-audit.tsv
      - results/15-train-classifier/reference-split-audit.tsv
