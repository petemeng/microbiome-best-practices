    acceptance_checks:
      - 五十五篇 HTML 均由真实数据执行、一次性环境审计或可追溯一手研究台账生成
      - 第 01 篇学习路线图和两张预览图均无文字截断，图内文字为英文
      - 第 02 篇报告真实 taxonomy 注释覆盖，并区分直接测量、有限推断与未测量
      - 第 03 篇揭示 Group 与 Salinity 完全混杂，并把 pilot 效应明确限制为样本量敏感性情景
      - 第 04 篇同时运行 frequency、prevalence、combined 与按板敏感性分析，并保留 feature/sample 审计表
      - 第 05 篇同时审计设计矩阵、Bray-Curtis/Aitchison 群落效应、feature 层 FDR、离散度和 leave-one-plate-out 稳定性
      - 第 06 篇核对真实 FASTQ 的 SHA-256、四行结构、R1/R2/barcode 同步、Phred+33、逐 cycle 质量和 75 样本 metadata
      - 第 07 篇区分 Windows 控制面与 Linux 执行面，并通过 20/20 环境、插件入口和真实 FASTQ 审计
      - 第 08 篇通过 20/20 安装与 Artifact 审计、3/3 FASTQ 哈希回验和 4/4 报错探针
      - 第 09 篇锁定 R 4.4.1 / Bioconductor 3.19 和 147 条包记录，通过 26/26 环境与对象检查、12/12 包版本检查及 6/6 对象等价检查
      - 第 10 篇通过 45/45 导入、拆样、provenance、FastQC 与 MultiQC 检查，692/2,000 对 reads 映射至 56 个观察样本，3/3 文件级质量报告完整
      - 第 11 篇通过 50/50 引物存在性、区域方向、q2-cutadapt、成对保留、长度与 provenance 检查；正确 V4 引物保留 8,614/10,000 对，错误区域与 Atacama skip 分支均保留 0 对
      - 第 12 篇通过 122/122 DADA2 截断、质量、overlap、逐阶段损失、ASV 长度、Artifact 与 provenance 检查；220/200 主参数保留 5,213/8,614 对并得到 366 个 ASV
      - 第 13 篇通过 55/55 ITSxpress、DADA2、Artifact、UNITE build/evaluation 与 PR2 全库检查；ITSxpress 保留 2,065/5,000 对，DADA2 最终保留 1,753 对并得到 16 个变长 ASV
      - 第 14 篇通过 91/91 source checksum、区域参考、统一 consensus-VSEARCH、Artifact、provenance、逐 rank、脱靶与 crosswalk 检查；SILVA、GTDB、Greengenes2 分别注释 358、356、362 个真实 V4 ASV
      - 第 15 篇通过 80/80 reference checksum、known-lineage split、两次训练、三档 confidence、Artifact、provenance 与图形检查；0.70 下 genus precision/recall/F1 为 0.938/0.800/0.864
      - 第 16 篇通过 74/74 official-reference、SEPP、rooted tree、jplace、tip/branch、feature filtering、Artifact 与 provenance 检查；366 个 ASV 与 5,213 条 reads 全部保留，但 131 个 ASV 的 top LWR 低于 0.50
      - 第 17 篇通过 82/82 输入哈希、方向、ID、完整树裁剪、五组件构建和 RDS 往返检查；366 个 ASV、4 个技术库与 5,213 条 reads 在转换前后保持一致
      - 第 18 篇通过 171/171 数据、环境、字体、颜色编码、最终尺寸与文件格式检查；四张图生成 8 个矢量文件与 8 个 600 ppi 位图文件
      - 第 19 篇通过 193/193 输入、指标公式、phyloseq/vegan 一致性、10,000-read 稀释、0.90 coverage、Hill numbers 与四格式图形检查；组别只作描述、不执行组间检验
      - 第 20 篇通过 188/188 输入、设计门禁、0.90 coverage Hill 指标、Kruskal–Wallis/Holm、九个计划成对比较、Cliff's delta、5,000 次 bootstrap 与四格式图形检查
      - 第 21 篇通过 239/239 三件套哈希、18,988-tip 根树、六类距离、50,000-read 稀释、CLR 伪计数、gemelli Robust Aitchison 双跑确定性、PCoA 负特征值与四格式图形检查
      - PCoA 同时报告 PERMANOVA 与 betadisper，不出现 Methods 超前声明
      - 第 23 篇通过 214/214 输入、技术重复聚合、split-plot 合法置换、PERMANOVA/PERMDISP、四个精确 simple effects、Holm 校正、ANOSIM/MRPP 方向与四格式图形检查
      - CAP 环境模型使用自己的轴标签、逐变量检验、VIF 和校正解释率
      - 第 25 篇通过 221/221 输入、环境变量、共线性、固定置换、envfit/BH、Mantel/Holm、partial Mantel 边界、adjusted VPA、VIF、敏感性与四格式图形检查
      - 第 26 篇通过 195/195 输入、七级注释完整性、逐样本 closure、Top-N、Unknown/Other、equal-sample/pooled-read、all-read/known-only denominator 与四格式图形检查
      - 第 27 篇通过 209/209 输入、五级分辨率、缺失父级、rank-qualified label、完整 lineage、同名碰撞、Top-N 与权重/分母敏感性及四格式图形检查
      - 第 28 篇通过 320/320 输入、feature-level abundance–occupancy、global/group core、阈值/read-depth 敏感性、互斥 rare states、local rare mass 与四格式图形检查
      - 第 29 篇通过 222/222 输入、raw-count DMM、k=1–7、三准则、八次独立初始化、profile label matching、posterior uncertainty、过滤/深度/抽平/单人单样本、重复样本与四格式图形检查，并含独立“审计与升级”章节
      - 第 30 篇从真实湿地三件套重放 closure 反事实，明确区分 raw reads、relative abundance、CLR/ALR 与 reference-frame sensitivity，并生成三张四格式原创图
      - 第 31 篇让 ANCOM-BC2、ALDEx2、MaAsLin2、LEfSe+BH 与 corncob 在同一 60 样本、80 行、CW-vs-IW 合同下运行；分别报告 44、47、52、51、62 个命中，并保存 tested/failed rows、方向与 Jaccard，而不把 union 写成 consensus
      - 第 32 篇在 Family、Genus 与 Species 分别重聚合、过滤和校正；Family/Genus 通过注释报告门禁，Species 因已知 reads 仅约 0.35% 而明确 FAIL、主报告命中数为 0
      - 第 33 篇由同一 ANCOM-BC2 master table 驱动 volcano、审计后 LEfSe cladogram、Manhattan 与 forest plot；79 个可报告属保持相同 contrast、方向和 FDR 定义
      - 第 34 篇从 reconsi/Vandeputte 三件套和独立 cell-load 表开始，只比较同一 Disease cohort 的 29 个 CD 与 66 个 healthy 样本，并用 2,000 次 bootstrap 并列展示 relative 与 quantitative scale
      - 第 35 篇保留 40 个预声明属和 780 个候选对；200 次 SparCC 得到 264 条边，SPIEC-EASI 得到 30 条边且全部属于 SparCC edge，StARS instability 0.0372；156/264 条 SparCC edge 通过按组中心化敏感性门禁
      - 第 36 篇以同一 40-node universe 审计 Zi-Pi、node attack、edge uncertainty 与 density-matched group rewiring，不把 topology 写成生态功能
      - 第 37 篇以 power 双门禁、grey fraction、全族 BH 与 pseudocount refit 审计模块、性状与 candidate hub
      - 第 38 篇使用同源 rooted tree、short-range phylogenetic-signal gate、999 次 βNTI/RCbray nulls 与固定 worker RNG stream
      - 第 39 篇同时报告 pooled/group migration estimates、predictive envelope、sample bootstrap、detection 与 rarefaction sensitivity
      - 第 40 篇分开计算 sample-use breadth、逐样本 RAD 与 within-region distance-decay，并保留 AIC/warning/Mantel ledger
      - 第 41 篇保留真实 PICRUSt2 2.6.3 命令日志、37/37 ASV NSTI audit、pathway coverage 与完整 225-test BH ledger
      - 第 42 篇报告 FAPROTAX read coverage、93-function effect/FDR family 与 genus-only taxonomy sensitivity
      - 第 43 篇所有 feature filtering、CLR 与 tuning 均在 outer training fold 内重拟合，并保存 sample-level out-of-fold predictions、calibration、label null 和 apparent/held-out 对照
      - 第 44 篇以 study 为 meta-analysis 单位，并让整队列 held-out validation 完全隔离 preprocessing、feature selection 与 tuning
      - 第 45 篇按每只动物实际 sampling week 建立 time origin，逐属 Cox 同时做 BH/PH audit，ridge-Cox 只在锁定 test set 评估一次
      - 所有随机过程固定 seed，图内文字为英文
    common_failures:
      - Quarto 二进制尚未安装
      - R 包版本不完整或 cairo PDF 设备不可用
      - 环境表与 16S 样本表没有共同样本
      - batch 与生物分组完全混杂，设计矩阵不满秩
      - FASTQ 压缩流损坏、record 数不等或 read ID 顺序错位
      - 分组样本过少导致置信椭圆无法估计
