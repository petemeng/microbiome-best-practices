      - pilot/_site/chapters/45-survival-analysis.html
    command: |
      set -eu
      mkdir -p "${RUN_ROOT}/results"
      python3 "${MANIFEST_DIR}/scripts/validate_articles_41_45.py" \
        --project-root "${MANIFEST_DIR}" \
        --site-root "${RUN_ROOT}/pilot" \
        --output "${RUN_ROOT}/results/articles-41-45-validation.json"
    expected_outputs:
      - results/articles-41-45-validation.json
    acceptance_checks:
      - 第 41 篇按上游规则 eval:false 并保留一次性真实运行日志；第 42–45 篇均为 eval:true、freeze:auto
      - 五篇正文结构、内联准备工作、固定 seed、真实三件套/FASTA 与 HTML 标题一致
      - 二十张主图的八十个 PDF/SVG/PNG/TIFF 文件存在；位图至少 590 ppi、TIFF LZW、SVG 无中文图内文字
      - 37-ASV chemerin、三个 MicrobiomeHD CRC cohorts 和 173-mouse MiSurv 数据维度、分组、event/time origin 与来源摘要一致
      - 418-package R 锁包含 ggpicrust2/ranger/pROC/metafor/timeROC，PICRUSt2 YAML 固定 2.6.3
      - NSTI/pathway FDR、FAPROTAX coverage、nested-CV/null、REML/external AUC 与 Cox/timeROC ledger 与正文一致
    common_failures:
      - 把 predicted function 解释为 measured gene、activity 或 metabolite production
      - feature filtering、CLR、tuning 或 threshold 在 cross-validation/external test 之前看到了 held-out outcome
      - 合并 study-level residuals 或把 random sample split 冒充 external validation
      - survival time origin 未按每个样本实际采样周计算，或把 censored subjects 当 controls
      - 单栏图标题、caption、图例或 ggrepel 标签超出最终画布
    outputs:
