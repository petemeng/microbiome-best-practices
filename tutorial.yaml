      - figures/21-pcoa-metric-comparison.svg
      - figures/21-pcoa-metric-comparison.png
      - figures/21-pcoa-metric-comparison.tiff
      - figures/21-aitchison-zero-sensitivity.pdf
      - figures/21-aitchison-zero-sensitivity.svg
      - figures/21-aitchison-zero-sensitivity.png
      - figures/21-aitchison-zero-sensitivity.tiff
    acceptance_checks:
      - 五份数据输入逐文件 SHA-256、18,988 features、26 samples、28,216,678 reads、非负整数 counts 与三件套 ID 集合全部通过
      - rooted tree 含 18,988 个唯一 tips，tip 集与 otutab 精确相等，具有有限非负 branch lengths；不得静默取 feature/tree 交集
      - Bray-Curtis、binary Jaccard、unweighted UniFrac 与 weighted UniFrac 固定在 seed 20260722 的每样本 50,000 reads 表上，共保留 26 样本、1,300,000 reads；Bray 对原始相对丰度的敏感性相关同时保存
      - Aitchison 两分支均从未稀释计数开始，并使用 total count > 10、prevalence > 10% 的同一 11,063-feature 集；经典 CLR 明报 pseudocount 0.5，并比较 0.1/0.5/1.0
      - Robust Aitchison 使用独立 Python 3.12.13/gemelli 0.0.13 环境、3 components、5 OptSpace iterations 与显式 ARPACK seed；双次运行的五个核心输出 SHA-256 必须完全一致
      - 六个距离矩阵都必须有限、对称、对角为零、26 × 26 且样本顺序可追踪；相关矩阵只作测量口径比较，不把高相关写成方法等价
      - 每个 PCoA 保存全部原始特征值审计；weighted UniFrac 的小负特征值用 Lingoes 校正后作图，其他距离不得无说明地校正
      - 四张英文原创图各导出 PDF/SVG/600 ppi PNG/LZW-TIFF，并通过物理尺寸、像素、字体、SVG 文本和压缩审计
    common_failures:
      - 把 Bray-Curtis、Jaccard、UniFrac 与 Aitchison 当作可互换配色选项，不预先声明生物学问题
      - presence/absence 距离不锁测序深度，使低深度样本因漏检稀有 feature 而看起来更远
      - 用没有 root、没有 branch length 或 tip ID 不匹配的树计算 UniFrac
      - 先把 counts 转相对丰度再做 CLR，或不说明 pseudocount 就对零值取对数
      - 把经典 Aitchison 与 Robust Aitchison 混写为同一个算法，或继续依赖未维护的旧 DEICODE 仓库
      - 对不同 feature filter 的经典与 Robust Aitchison 直接比较距离相关
      - PCoA 忽略负特征值，或把二维坐标正负解释成菌群好坏
      - 根据哪种距离最能分组再选择主结果，造成未披露的 outcome-driven metric selection
    outputs:
      - results/21-beta-distances/beta-distances-summary.json
      - results/21-beta-distances/tree-audit.tsv
      - results/21-beta-distances/distance-summary.tsv
      - results/21-beta-distances/distance-correlation.tsv
      - results/21-beta-distances/pcoa-eigen-audit.tsv
      - results/21-beta-distances/aitchison-pseudocount-sensitivity.tsv
      - results/21-beta-distances/gemelli-determinism-audit.tsv
      - results/21-beta-distances/validation.log
      - figures/21-distance-choice-map.png
      - figures/21-distance-correlation.png
      - figures/21-pcoa-metric-comparison.png
      - figures/21-aitchison-zero-sensitivity.png
    method_basis:
      type: external-benchmark
      summary: >
        以 Bray-Curtis/Jaccard 的 abundance 与 occurrence 对象、UniFrac 的
        phylogenetic branch geometry、Aitchison 的 log-ratio geometry 以及
        Martino et al. observed-only rclr/RPCA 为边界，用真实 16S 数据生成
        输入、标准化、零值、距离矩阵、PCoA 与文件级验收证据。
    references:
      - title: Global patterns of 16S rRNA diversity at a depth of millions of sequences per sample
