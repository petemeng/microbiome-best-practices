      - figures/28-rare-biosphere-mass.svg
      - figures/28-rare-biosphere-mass.png
      - figures/28-rare-biosphere-mass.tiff
    acceptance_checks:
      - 三件套、来源摘要、准备脚本和共享作图函数逐文件 SHA-256 全部锁定；输入为 13,628 features、90 samples、1,619,670 reads，IW/CW/TW 各 30 个样本
      - 主分析在原始 feature/OTU 层逐样本闭合，以 all-read relative abundance ≥0.0001 定义 detected，并以 prevalence ≥0.80 定义 global core；不先按 genus 合并未知 feature
      - 主阈值产生 97 个 global core features，合计等样本平均 abundance 约 0.17036；其中 34 个 feature 的全局均值低于 0.1%，说明 core 与 abundant 不是同义词
      - IW、CW、TW 组内 core 分别为 166、160、278 个；三个组共有 59 个、并集 425 个；global core 与 shared-three-group core 分开报告
      - detection sensitivity 固定 Presence、0.01%、0.05%、0.1%，prevalence 固定 50%、80%、90%、100%；在 80% prevalence 下 core 数依次为 334、97、9、0
      - 0.01% 相对丰度阈值在原始 library depth 上对应每样本至少 2–4 reads；不得把一次 read 检出当作统一检测强度
      - seed 20260728 将全部 90 个样本稀释到 10,000 reads；raw-presence core 由 334 个变为 167 个，主 0.01%-core 与 rarefied one-read core 的 Jaccard 约为 0.58084，此分支只用于深度敏感性
      - 单样本 local rare mass 主定义为 0 < relative abundance < 0.1%；90 个样本的等权均值约 0.44150，范围约 0.23330–0.59435，并保留 0.01%、0.05%、0.1%、0.5% 阈值网格
      - feature states 为互斥穷尽分类：97 primary core、200 conditionally rare、1,155 sampling-limited、8,407 persistently rare 与 3,769 intermediate features；sampling-limited 只表示当前 read/occupancy 证据不足
      - group、Type 与 Saline 结构保持可见；本篇不对 core/rare mass 运行组间显著性检验，也不把 presence、relative abundance 或 CRT 标签写成活性、功能或绝对细胞量
      - 四张英文原创图各导出 PDF/SVG/600 ppi PNG/LZW-TIFF，并通过物理尺寸、像素、字体、SVG 文本与 TIFF 压缩审计
    common_failures:
      - 只写“出现在多数样本”却不报告 detection threshold、边界是否包含、feature rank 和样本集合
      - 先把所有未注释 OTU 合并为一个 Unknown genus，再把这个人工聚合项称为 core taxon
      - 每组使用不同 detection/prevalence 规则，随后用 Venn 或 UpSet 图暗示集合可直接比较
      - 用 pooled reads 计算 occupancy 或 group core，使高测序量样本获得额外权重
      - 把低总 reads、低 occupancy 的 feature 直接解释为生态稀有或 dormant seed bank
      - 把 rarefaction 分支当作差异丰度输入，或把一次固定深度抽样当作原始 core 的唯一真值
      - 将相对丰度低但可在少数样本升高的 conditionally rare feature 与始终低于阈值的 tail 合并
      - 对 Group 做显著性检验后忽略 Group/Saline 完全混杂和缺少 site/block/subject 标识的边界
