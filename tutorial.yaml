      - taxonomy 明确记录原始 soilrep 对象未分发分类表，不用 Unclassified 标签冒充真实注释；本篇只使用其 ID 对齐功能
      - 56 个技术库按 BiologicalSampleID 聚合为 24 个生物学样本；6 个 Block 各有 Ambient/Warmed × Unclipped/Clipped 四个单元，每个单元只贡献一次推断，技术库数仅作测量审计
      - 主分支预先保留在任一 treatment 的至少 4 个技术库中检出的 feature，共 1,824 个；随后转样本内相对丰度并计算 Bray-Curtis，不根据 P 值反选距离或阈值
      - split-plot 置换空间为 8^6 = 262,144；seed 20260723 抽取 9,999 个唯一非恒等置换，任何样本不跨 Block，whole plots 成组交换且 clipping 只在 main plot 内交换，最低 Monte Carlo P 为 0.0001
      - blocked PERMANOVA 同时保存四组 omnibus 与 warming、clipping、interaction 的 pseudo-F、总 R2、partial R2、P 值和有效置换数；交换正交主效应顺序不得改变 sums of squares
      - betadisper 使用 spatial median 与 small-sample bias adjustment，permutest 使用同一受限置换矩阵；结果必须与 PERMANOVA 分开措辞，不能把 dispersion P 当作 centroid 校正
      - 四个事先定义的 simple-effect 比较各完整枚举 63 个非恒等 block 内成对交换，报告总/partial R2、原始 P、Holm P 和 1/64 的最小 P 分辨率
      - ANOSIM 与 MRPP 只作为次要方法比较，必须使用同一主距离和受限置换矩阵；不得将三个相关检验当作三次独立证据或按最小 P 挑方法
      - 敏感性表同时展示未做 prevalence filter、24 个生物学样本自由置换和 56 个技术库自由置换；无效伪重复分支必须显式标记，不进入生物学结论
      - 四张英文原创图各导出 PDF/SVG/600 ppi PNG/LZW-TIFF，并通过物理尺寸、像素、字体、SVG 文本与 TIFF 压缩审计
    common_failures:
      - 把 PCR/tag 技术重复当作独立 n，夸大自由度并得到过度乐观的 P 值
      - 只写 permutations = 9999，却不说明哪些样本可以互换、理论置换空间和最低 P 分辨率
      - 复杂 split-plot 设计只用 strata = Block，遗漏 whole-plot 与 within-plot 层级
      - 先试 Bray、Jaccard、UniFrac、Aitchison，再发表最显著的一个而不披露选择过程
      - PERMANOVA 显著就声称组中心一定不同，或 PERMDISP 不显著就声称方差完全相等
      - 把 R2 省略，只凭大样本或大量置换得到的小 P 值解释生物学重要性
      - 所有成对比较各自用 0.05，不对预先定义的比较族做 multiplicity correction
      - ANOSIM、MRPP 和 PERMANOVA 三者取最小 P，或把不同量纲的统计量画在同一数值轴上
    outputs:
      - results/23-permanova-dispersion/permanova-dispersion-summary.json
      - results/23-permanova-dispersion/design-audit.tsv
      - results/23-permanova-dispersion/permutation-audit.tsv
