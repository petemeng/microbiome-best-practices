id: microbiome-best-practices-16s
slug: microbiome-best-practices-16s
title: 微生物组分析最佳实践 · 16S 系列
problem_statement: >
  面向懂生物学但缺少系统生信训练的科研读者，建立一套由真实数据、
  可执行代码和发表级重绘图共同支撑的 16S 扩增子分析教程。网页版与
  微信公众号文章都必须单篇自足，能够从数据准备一直复现到结果解释和图形导出。
audience:
  level: 科研初中级
  summary: >
    适合已经了解 16S 测序用途，但尚不能独立完成实验设计、QIIME2 上游处理、
    R 下游统计、方法边界判断和投稿级作图的生物医学或环境微生物研究者。
language:
  primary: zh-CN
  terminology: en
covers:
  - 从实验设计、污染控制和批次效应到 FASTQ 与扩增子数据结构
  - QIIME2 导入、引物处理、DADA2、分类注释与系统发育树
  - 统一使用 otutab、taxonomy、metadata 三件套完成 R 下游分析
  - 多样性、组成、差异丰度、网络、功能预测、机器学习与多组学整合
  - 纵向分析、中介、SEM、MR 与因果证据边界
  - 网页版和微信公众号版共享结论、数据、代码与重绘图
prerequisites:
  - 能阅读基础 R 与 shell 命令
  - 理解样本、ASV/OTU、taxonomy 和 metadata 的基本含义
  - 下游章节使用 R 4.4 系列；上游章节使用已锁定并验证的独立 QIIME 2 2026.4 环境
  - 每篇文章均提供本篇所需依赖、真实数据入口和完整代码
workflow_overview:
  - 先验证 55 篇目录、标题、编号和单篇自足规则
  - 从版本锁定的 microeco、decontam 与 phyloseq 真实 16S 数据导出各篇所需标准三件套
  - 校正并实跑第 22 篇非约束排序、第 24 篇约束排序、第 25–54 篇下游统计、组成、差异丰度、定量、网络、功能预测、机器学习、多组学、纵向与因果推断分析
  - 以通过 QA 的第 01–55 篇固定全系列结构、作图主题与数据接口
  - 按编号逐篇选择公开数据和锚定文献，执行、解释并重绘原创结果图
  - QA 通过后再派生网页版和本地微信公众号完整文章
results_check:
  - 系列目录应包含 55 篇且编号 01–55 连续、标题与 tutorial.yaml 一致
  - pilot 数据应包含 13,628 个 OTU、90 个 16S 样本和 200 行环境观测
  - 第 01–55 篇应从公开数据、一次性环境审计或可追溯一手研究台账独立渲染为 HTML，并生成规定的 PDF、PNG 与 TIFF 图；第 18–21、23、25–55 篇还必须生成 SVG
  - 图内轴、图例、分组和统计标注均使用英文
  - 微信公众号派生稿应保留完整依赖、数据准备、分析和导出代码
troubleshooting:
  - 如果 CRAN 归档下载失败，先检查 URL 白名单、网络和 SHA-256，再考虑镜像
  - 如果三件套维度不一致，先核对 OTU 行名、taxonomy 行名和 metadata 样本名
  - 如果 Quarto 无法渲染，先检查 Quarto、R、knitr 和所需 R 包版本
  - 如果排序图结果变化，检查抽样、NMDS 和置换步骤是否固定随机种子
  - 如果 Methods 描述与代码不一致，以实际 QA 证据为准并阻止发布
reproducibility:
  strategy:
    - tutorial.yaml 是内容、执行和发布的唯一契约
    - 每篇从公开数据或版本锁定包数据开始，不读取其他章节生成的隐性中间对象
    - 下游章节真实执行并缓存结果；上游重型章节保留一次性日志和截图证据
    - 网页与微信公众号文章由同一份 QMD、数据和结果图派生
  rerun_key:
    - microeco 源码包固定为 2.0.0 并校验 SHA-256
    - pilot 环境固定 R 4.4.1、Quarto 1.9.38 与 env/renv.lock 中的 R 包版本
    - 上游环境文件固定为 QIIME 2 2026.4 官方 Linux distribution
    - 第 14 篇固定 SILVA 138.2、GTDB R11-RS232 与 Greengenes2 2024.09 的官方 source checksum、515F/806R 区域提取、exact-sequence LCA 去冗余与 consensus-VSEARCH 参数
    - 第 15 篇固定 SILVA 138.2 V4 LCA reference checksum、known-lineage SHA-256 拆分、7-mer hashed Naive Bayes 参数、三个 confidence 阈值与 scikit-learn 1.7.1
    - 第 16 篇固定 QIIME 2 官方 Greengenes 13_8 SEPP reference Artifact 的 URL、SHA-256、UUID、语义类型与 legacy-backbone 边界
    - 第 17 篇固定 nf-core V4 `otutab`/`taxonomy`/`metadata` 三件套、taxonomy confidence、366 条代表序列和完整 203,818-tip SEPP 根树的逐文件 SHA-256；对象构建前显式核对方向与 ID，并固定 phyloseq 1.48.0、ape 5.8 与 Biostrings 2.72.1
    - 第 19 篇固定真实湿地三件套、10,000 reads sample-size standardization、0.90 coverage standardization、Hill q=0/1/2、iNEXT 3.0.2 与 seed 20260721；原始、等 reads 和等 coverage 结果必须分表保存
    - 第 20 篇从同一 checksum-locked 三件套独立重算 0.90 coverage Hill q=0/1/2；当前 metadata 无 SubjectID/Time，固定选择三组独立样本分支；主分析为 Kruskal–Wallis、三指标 Holm 校正、九个计划成对 Wilcoxon–Mann–Whitney 比较、Cliff's delta 与 5,000 次组内 bootstrap 95% CI，seed 为 20260721
    - 第 21 篇固定 phyloseq 1.48.0 GlobalPatterns 的 18,988 × 26 非空 OTU 表、七级 taxonomy、metadata 与 18,988-tip rooted tree；Bray/Jaccard/两种 UniFrac 在 seed 20260722 的 50,000 reads 同深度表上计算，经典 Aitchison 与 gemelli 0.0.13 Robust Aitchison 在未抽平且相同的 total-count/prevalence 过滤后计算；PCoA 负特征值和伪计数敏感性必须审计
    - 第 23 篇固定 phyloseq 1.48.0 soilrep 的 16,825 × 56 技术库三件套与 seed 20260723；先把技术标签库聚合为 24 个真实生物学样本，再按原研究 6-block warming × clipping split-plot 设计生成 9,999 个唯一受限置换；主分支为论文预声明 prevalence 规则后的相对丰度 Bray-Curtis，PERMANOVA 必须与 PERMDISP、四个计划 simple-effect 比较及 Holm 校正共同报告
    - 第 25 篇固定 microeco 2.0.0 湿地四表、5% prevalence、relative-abundance Bray-Curtis、Hellinger community matrix、seed 20260725 与 999-row free-permutation matrix；envfit 11 项做 BH 校正，三个预设 Mantel blocks 与两个可检验 VPA pure fractions 分别做 Holm 校正，partial Mantel 只作非主敏感性分析
    - 第 26 篇固定同一 checksum-locked 湿地三件套、seed 20260726 与逐样本 closure；门水平 Top 10 由等样本均值确定，Unknown 与 Other 分离，组均值不得默认 pooled reads；同时审计 Top-N、known-only denominator、样本权重与七级 taxonomy completeness
    - 第 27 篇固定同一 checksum-locked 湿地三件套、seed 20260727 与 Phylum→Class→Order→Family→Genus 五级合同；每级使用 rank-qualified label 和完整 lineage key，空注释保留为 rank-specific Unknown，不回填缺失父级；全局 Top-N 由逐样本闭合后的等样本均值确定，跨组复用同一名单，并审计层级断裂、同名冲突、完整 genus lineage、Top-N coverage、pooled-read weighting 与 known-only denominator
    - 第 28 篇固定同一 checksum-locked 湿地三件套、seed 20260728 与 feature-level abundance–occupancy 合同；主 core 使用 all-read relative abundance ≥0.01% 且 prevalence ≥80%，全局与组内 core 分开计算；presence/0.01%/0.05%/0.1% detection、50%/80%/90%/100% prevalence、10,000-read rarefaction 与 0.01%/0.05%/0.1%/0.5% local-rarity thresholds 全部保存为敏感性审计
    - 第 29 篇固定 DirichletMultinomial 1.46.0 分发的 Holmes/Turnbaugh Twins 真实 genus-count 数据、278 个样本、130 个 source categories、570,851 reads 与 seed 20260729；主 DMM 直接使用未转相对丰度、未加伪计数、未抽平的整数 counts，候选 k=1–7，以 fresh-fit Laplace minimum 预选 k，AIC/BIC 只作并列诊断；k=4 标签按 fitted Bacteroides、Prevotella 比例确定性排序，并审计 package reference fit、八个初始化、5% prevalence、测序深度、单人单样本、后验不确定性和重复样本一致性
    - 第 36 篇固定同一组 40 个 group-blind 命名属、seed 20260736、SparCC/SPIEC-EASI 双网络、500 次 node-failure、499 次 group-label permutation 与 500 次组内 sample bootstrap；Zi-Pi 与 robustness 只解释为推断图属性
    - 第 37 篇固定 422 个命名属、CLR pseudocount 0.5、signed WGCNA power 双门禁、seed 20260737、module-trait 全族 BH 与 pseudocount 1.0 refit；candidate hub 需同时通过 kME 与 module-specific connectivity 门禁
    - 第 38 篇固定 microeco 2.0.0 的 14,096-tip rooted branch-length tree、585-OTU 主过滤、999 次 βNTI/RCbray null randomization 与显式 L'Ecuyer worker streams；先执行三个 short-range phylogenetic-signal tests，再用 220-OTU/199-randomization 分支审计过滤敏感性
    - 第 39 篇固定 90-sample wetland metacommunity、Sloan beta-distribution NCM、exact-binomial predictive envelope、每个 pool 200 次 sample bootstrap、seed 20260739–20260742，并审计 fixed detection、10,000-read rarefaction 与 17 个 detection limits
    - 第 40 篇固定 5% prevalence/100 reads 的 Levins breadth universe、90 个逐样本五候选 RAD fits、Haversine geographic distance、within-region log-log slopes 与 999 次 sample-label Mantel permutations；pooled permutation 限制在 region blocks 内
    - 第 41 篇固定官方 chemerin archive SHA-256、37 条 representative sequences、PICRUSt2 2.6.3、ggpicrust2 2.5.17、maximum NSTI 2.0 与 facility-adjusted 225-pathway BH family；预测只解释为 functional potential
    - 第 42 篇固定 microeco 2.0.0 湿地三件套、FAPROTAX 1.2.12、93-function BH family、Kruskal–Wallis epsilon-squared 与 full-lineage/genus-only taxonomy sensitivity
    - 第 43 篇固定 Vandeputte Disease cohort、seed 20260743、3×5 outer nested CV、training-fold feature/CLR/tuning、1,000 次 sample bootstrap、50 次 label permutation，并把 apparent training score 与 out-of-fold score分开
    - 第 44 篇固定 MicrobiomeHD Xiang/Zhao/Zackular 三个 CRC cohort archive checksum、study-level REML/tau²/I² 与 leave-one-study-out preprocessing/tuning；held-out cohort 不参与任何选择
    - 第 45 篇固定 MiSurv commit 692a2ac、173 只 NOD mice 的逐样本 sampling week、T1D event/censoring、seed 20260745、adjusted genus Cox/BH/PH audit 与 locked-test ridge-Cox/timeROC
    - 第 46–48 篇固定 Franzosa IBD 配对 microbiome–metabolome 数据 commit 89a519d8、220 个严格配对样本与 outcome-blind feature universe；依次审计 Procrustes/Mantel/HAllA、sPLS/DIABLO locked test，以及原生 MMvec 1.0.5 与 mofapy2 0.7.4
    - 第 49 篇固定 Duran Arabidopsis interkingdom 数据 commit 6db5e85、36 个 bacteria/fungi/oomycete 严格配对样本、3 × 3 balanced niche design 与 seed 20260749
    - 第 50 篇固定 FEAST 官方 demo commit 2f8f3df、1 sink/9 sources/1,839 anonymous taxa、5,000-read depth、FEAST 0.1.0 与 SourceTracker2 2.0.1，并把 leave-one-out 和 missing-source sensitivity 纳入主审计
    - 第 51 篇固定 O'Keefe DietSwap 真实纵向数据、38 位受试者、222 个观测与 6 个 timepoints；主分析用 subject random intercept，并以 AR(1)、相邻时点 Bray–Curtis volatility 和 cohort-by-time interaction 审计重复测量结构
    - 第 52 篇固定 microeco 2.0.0 湿地三件套与实测环境表；预设 piecewise SEM、directed-separation Fisher's C、竞争 DAG、残差诊断与 PLS-PM bootstrap 必须共同报告，不把路径图等同因果图
    - 第 53 篇固定 Franzosa IBD 严格配对样本与预先指定的 steroid→Faecalibacterium CLR→胆汁酸中介链；ACME/ADE 使用 2,000 次模拟并报告未测混杂敏感性，不以横断面时间顺序宣称机制
    - 第 54 篇固定 MiBioGen Bifidobacterium 暴露和 GWAS Catalog GCST004131 IBD 结局；候选 6 个跨染色体工具经 harmonisation 保留 5 个，联合 IVW、weighted median、MR-Egger、leave-one-out、heterogeneity 与 MR-PRESSO，并显式标记 Steiger 与 colocalisation 不可得
    - 第 55 篇固定七项一手微生物组研究与 Hill 框架的可追溯证据台账；作为无统计代码的批判性阅读章，只校准研究设计可支持的措辞，不把证据阶梯当自动评分
    - 所有随机分析显式固定 seed，章节输入文件纳入校验
  provenance:
    - QA 报告记录下载、工具版本、命令、日志、输出摘要和断言
    - 每篇记录数据论文、方法论文、公开代码与许可证
    - 发表图只使用本项目基于公开数据重新生成的图，或明确具备转载许可的材料
