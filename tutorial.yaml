      citation: Chao A, Gotelli NJ, Hsieh TC, et al. Ecological Monographs. 2014;84(1):45-67.
    - title: "iNEXT: an R package for rarefaction and extrapolation of species diversity (Hill numbers)"
      journal: Methods in Ecology and Evolution
      year: 2016
      relevance: >
        提供第 19 篇固定的 estimateD size/coverage 实现和可复核输出结构。
