    acceptance_checks:
      - 四份输入 SHA-256、13,628 features、90 samples、1,619,670 reads、非负整数 counts 与 feature/sample ID 集合全部通过
      - raw 表保留全部 feature，不在 Observed/Chao1 前删除 singleton；逐样本输出 singleton、doubleton、Good coverage、Observed、Chao1、Shannon、Simpson、Pielou 与 Hill q=0/1/2
      - library size 为 10,364–37,374 reads，raw Observed 与 depth 的 Spearman 相关至少为 0.75，明确提示 richness 的测序深度依赖
      - 10,000 reads 等样本量标准化保留 90/90 样本且不生成供差异丰度复用的随机抽平计数表
      - 0.90 coverage 标准化使用 iNEXT 3.0.2；56 个样本为 interpolation、34 个为短程 extrapolation，最大隐含测序量不超过原 library size 的 1.5 倍
      - q=0、1、2 分别解释为 observed-richness weight、exp(Shannon) 与 inverse Simpson 的有效 feature 数；组别汇总只作描述，不在本篇执行组间假设检验
      - 四张英文原创图各导出 PDF/SVG/600 ppi PNG/LZW-TIFF，并通过物理尺寸、像素、格式与压缩审计
    common_failures:
      - 在计算 Chao1 或 Observed 前按 prevalence/abundance 删除 singleton，导致 richness 被人为压低
      - 把 Shannon、Simpson 和 Hill q=1/q=2 混为同一量纲，或把 vegan Simpson 误写成 inverse Simpson
      - 只看稀释曲线“像平台”就宣布测序绝对充分，忽略 coverage、singleton 和 estimator 不确定性
      - 抽到全队列最浅样本却不报告丢弃 reads 比例，或不固定随机种子
      - 把用于 alpha/beta 描述的抽平表继续用于差异丰度模型
      - 把 group-pooled 曲线当成 30 个独立样本的组间统计证据
      - 以 reads coverage 代替细胞、物种或绝对丰度覆盖度，忽略 PCR、拷贝数与数据库偏差
