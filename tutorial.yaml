    acceptance_checks:
      - 三件套、来源摘要、准备脚本和共享作图函数逐文件 SHA-256 全部锁定；输入为 13,628 features、90 samples、1,619,670 reads，三组各 30 个样本，library depth 为 10,364–37,374
      - Kingdom 到 Species 七级均去除 rank prefix、把空注释规范为 rank-specific Unknown，并逐样本验证每级相对丰度闭合到 1
      - 门水平有 56 个标签，属水平有 772 个标签；Unknown phylum、genus、species 的等样本均值分别约为 0.00346、0.63106、0.99635
      - 门水平 Top 10 仅在 55 个已知门中按 90 个样本的等权均值排序；平均覆盖率为 0.94803，单样本范围为 0.86516–0.98917
      - Other known phyla 只包含未进入 Top 10 的已知门，Unknown phylum 始终独立，折叠后的每个样本仍精确闭合到 1
      - 组均值主结果先逐样本闭合再等权平均；pooled-read weighting 只作敏感性分析，三组 total variation 均完整保存
      - equal-sample 与 pooled-read 选出的门水平 Top 10 Jaccard 为 1；一致的入选名单不被解释为两种权重方案完全等价
      - Top-N sensitivity 固定 5、8、10、15、20 五个分支，保存平均、最小、最大 coverage 与 Other known fraction
      - 属水平气泡图固定 Top 15 已知 genera 加 Unknown genus，点大小为 all-read mean abundance，颜色为 count > 0 的 prevalence
      - known-only denominator 只作敏感性分析；最大组–属均值放大为 7.273 percentage points，正文不得把它与 all-read relative abundance 混用
      - 热图固定 Top 20 已知 genera、log1p(relative abundance × 10,000) 显示变换、complete-linkage 行聚类；列按 Group/Type/SampleID metadata 顺序而非 outcome 聚类
      - 四张英文原创图各导出 PDF/SVG/600 ppi PNG/LZW-TIFF，并通过物理尺寸、像素、字体、SVG 文本与 TIFF 压缩审计
    common_failures:
      - 先合并组内全部 reads 再计算组比例，使高测序量样本获得更大权重
      - 把 Unknown 与低丰度已知类群都塞进 Other，隐藏分类注释完整性
      - 删除 Unknown 后重归一化，却仍把结果写成以全部 reads 为分母的 relative abundance
      - 分别在每组选择 Top-N，导致相同颜色在不同面板代表不同 taxon
      - 用展示 Top-N 直接筛差异类群，遗漏只在单组富集的低总体丰度 feature
      - 把冲积 ribbon 解释为迁移或演替，或把描述性组成图当成组间显著性证据
      - 热图列按结果聚类后，未经稳定性验证就声称发现了新的样本分型
      - 从相对丰度变化推断绝对细胞数量或生物量变化
