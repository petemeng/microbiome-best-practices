    acceptance_checks:
      - QIIME 2/q2cli 2026.4.0、ITSxpress 2.1.4、Biopython 1.87、VSEARCH 2.30.4 与 HMMER 3.4 全部匹配固定环境
      - 四个准备后 FASTQ 的 SHA-256、gzip stream、2,500 条记录/文件和每个样本 R1/R2 read ID 完全同步
      - 当前 PairedEndFastqManifestPhred33V2 每个样本一行，输入和 ITSxpress 输出均为 SampleData[PairedEndSequencesWithQuality]
      - ITSxpress 使用 ITS2、taxa F、cluster identity 1.0 和单线程，两个样本分别保留 1,034/2,500 与 1,031/2,500 对 reads
      - ITSxpress 共保留 2,065/5,000 对 reads，且 raw 与 spacer-trimmed read-length geometry 明确不同
      - DADA2 不使用固定长度或额外 5′ 截断，以 maxEE 2/2、truncQ 2、minimum overlap 12、zero overlap mismatch、independent pooling 和 consensus chimera 运行
      - DADA2 总账本为 2,065 input、1,764 filtered、1,755 denoised、1,753 merged、1,753 non-chimeric
      - 最终得到 16 个 ASV、14 种长度，范围 143–270 nt，中位长度 191 nt
      - table provenance 包含 import、ITSxpress trim_pair_output_unmerged 与 DADA2 denoise_paired
      - UNITE v10.0 raw QIIME taxonomy 保留 8 个标签含 sh__，固定 QIIME 2 classifier build 在拟合前移除 sh__
      - UNITE evaluation QZV 的 SHA-256、Visualization semantic type 与 classifier release tag/commit/hash 全部通过
      - PR2 v5.1.1 全量 source SHA-256 对应 240,201 条 SSU 序列；全部为 9 个非空 taxonomy fields
      - PR2 中 bacterial、plastid、mitochondrial 与 archaeal labels 被保留并进入脱靶审计
      - 55/55 项环境、输入、处理、Artifact、provenance、reference 与图形检查通过
      - 四张英文证据图同时导出 PDF、PNG 与 350 dpi LZW TIFF
    common_failures:
      - 把文件名后缀当成压缩格式，不检查 pinned source 实际为 plain-text FASTQ
      - 沿用旧版一条 direction 一行的 V2 manifest，触发 duplicate sample ID
      - 把 18S 送入 ITSxpress，或把 ITS 套入固定窄长度门
      - 用 ITSxpress retention 解释真菌比例，或隐藏 sample-specific loss
      - 把 UNITE raw taxonomy 的 8 labels 与去除 sh__ 后的 classifier 输出混为一谈
      - 只抄数据库首页版本，不交叉核对 tag、commit、DOI、checksum 与 asset scope
      - 在看到 PR2 off-target label 后静默删除，而不先按样本和 control 记录
