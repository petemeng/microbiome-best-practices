  - id: validate-community-typing-dmm
    title: 实跑并验证第 29 篇 DMM 群落分型合同
    cache_revision: article-29-community-typing-dmm-nine-section-v2
    goal: >
      从 DirichletMultinomial 1.46.0 分发的 Holmes Twins 真实肠道 16S genus-count
      otutab、taxonomy、metadata 三件套独立开始，直接对原始整数 counts 拟合
      Dirichlet-multinomial mixture。主模型固定 seed 20260729、候选 k=1–7、
      minimum Laplace evidence 选择规则和最小 component size 14；同步保存 AIC/BIC、
      后验不确定性、确定性 label canonicalization、package reference fit、八次初始化、
      feature prevalence、library depth、rarefaction、one-sample-per-participant 与重复样本审计。
    rationale: >
      DMM state 是对过度离散计数分布的概率性近似，不是数据自带的肠型、CST、疾病亚型
      或不随时间变化的自然类别。只有把 count scale、候选 k、选择准则、初始化、标签交换、
      小类门槛、过滤与深度敏感性、后验不确定性和外部 metadata 边界写成可执行合同，
      才能避免只凭一张排序图或一个最优 k 过度解释群落分型。
    inputs:
      - env/renv.lock
      - data/small/community-typing-dmm/otutab.tsv
      - data/small/community-typing-dmm/taxonomy.tsv
      - data/small/community-typing-dmm/metadata.tsv
      - data/small/community-typing-dmm/source-summary.json
      - R/theme_pub.R
      - scripts/prepare_dmm_twins_data.R
