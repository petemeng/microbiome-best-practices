  - id: validate-alpha-group-tests
    title: 实跑并验证第 20 篇 Alpha 组间检验、效应量与多重比较合同
    cache_revision: article-20-alpha-group-tests-v1
    goal: >
      从 checksum-locked 的真实湿地 otutab、taxonomy、metadata 三件套独立开始，
      不读取第 19 篇结果文件；重新计算 raw、10,000 reads 与 0.90 coverage 的
      Hill q=0/1/2。先审计 metadata 是否包含 SubjectID、PairID、Time 或 block，
      再为当前 30 + 30 + 30 的三组独立样本执行预先指定的 Kruskal–Wallis
      主分析、三指标 Holm 校正、九个计划成对 Wilcoxon–Mann–Whitney 比较、
      Cliff's delta、5,000 次组内 bootstrap 95% CI，以及 Welch 与标准化敏感性分析，
      最后重绘四张英文出版图。
    rationale: >
      Alpha 数值是样本级响应，但组间推断仍由实验单位、配对/重复结构、
      标准化选择和检验族决定。箱线图上的星号不能替代设计审计、效应量、
      置信区间与多重比较控制；Kruskal–Wallis 检验的是秩分布差异，只有组间
      分布形状近似时才可简化为位置或中位数差异。因此发布前必须把设计选择、
      主分析、成对方向、敏感性和图形文件全部变成可追踪证据。
    inputs:
      - env/renv.lock
      - data/small/otutab.tsv
      - data/small/taxonomy.tsv
      - data/small/metadata.tsv
      - data/small/source_summary.json
      - R/theme_pub.R
      - scripts/validate_alpha_group_tests.R
    command: |
