  - id: validate-articles-46-50-release
    title: 验证第 46–50 篇发布资产与结果合同
    cache_revision: articles-46-50-native-multiomics-source-release-v2
    goal: >
      对五篇 HTML、二十张主图、八十个格式文件、三套新增真实数据、
      原生 MMvec/MOFA/HAllA/SourceTracker 环境和关键结果执行独立发布门禁。
    rationale: >
      多视图整合与来源追踪容易在样本配对、训练/留出边界、混杂校正、
      legacy runtime 和因果措辞上静默出错，因此需共同锁定正文、数据、环境、图形与结果。
    inputs:
      - scripts/validate_articles_46_50.py
      - env/renv.lock
      - env/mmvec-native.yml
      - env/multiomics.yml
      - env/sourcetracker2.yml
      - data/small/paired-ibd-multiomics/source-summary.json
      - data/small/multi-kingdom-duran/source-summary.json
      - data/small/source-tracking-feast/source-summary.json
      - chapters/46-procrustes-mantel-halla.qmd
      - chapters/47-spls-diablo.qmd
      - chapters/48-mmvec-mofa.qmd
      - chapters/49-multi-kingdom.qmd
      - chapters/50-source-tracking.qmd
      - pilot/_site/chapters/46-procrustes-mantel-halla.html
      - pilot/_site/chapters/47-spls-diablo.html
      - pilot/_site/chapters/48-mmvec-mofa.html
      - pilot/_site/chapters/49-multi-kingdom.html
      - pilot/_site/chapters/50-source-tracking.html
    command: |
      set -eu
      mkdir -p "${RUN_ROOT}/results"
      python3 "${MANIFEST_DIR}/scripts/validate_articles_46_50.py" \
        --project-root "${MANIFEST_DIR}" \
        --site-root "${RUN_ROOT}/pilot" \
        --output "${RUN_ROOT}/results/articles-46-50-validation.json"
    expected_outputs:
      - results/articles-46-50-validation.json
    acceptance_checks:
      - 五篇文章均为 eval:true、freeze:auto，含九段结构、内联作图函数、固定 seed 和本篇输入
      - 二十张主图的八十个 PDF/SVG/PNG/TIFF 文件存在；位图至少 590 ppi、TIFF LZW、SVG 无中文图内文字
      - Franzosa 220-sample paired views、Duran 36-sample three-kingdom design 与 FEAST 1-sink/9-source demo 的维度、顺序和固定 commit 一致
      - 第 48 篇及运行脚本直接调用 MMvec 1.0.5 的 MMvec class 与 mofapy2 0.7.4 entry point
      - 418-package R 锁包含 mixOmics 6.26.0、FEAST 固定 commit、HAllA 与第 51–54 篇所需 R 依赖
      - global concordance、locked-test DIABLO、MMvec holdout/MOFA、niche-adjusted cross-kingdom 和 source-tracking ledgers 与正文一致
    common_failures:
      - 两个 views 的 sample ID/order 未严格对齐，或在 split 前使用 outcome 做 feature selection
      - 把 training CCA、MMvec co-occurrence、MOFA factor 或 source allocation 写成机制或因果证据
      - 用现代 TensorFlow 环境强装 MMvec 1.0.5，或把 legacy runtime 混入日常环境
      - 只报告 raw cross-kingdom association，不做 niche adjustment、bootstrap 或 missing-source audit
    outputs:
      - results/articles-46-50-validation.json
    method_basis:
      type: project-experience
