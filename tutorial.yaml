      - figures/29-stability-audit.svg
      - figures/29-stability-audit.png
      - figures/29-stability-audit.tiff
    acceptance_checks:
      - 三件套、来源摘要、准备脚本和共享作图函数逐文件 SHA-256 锁定；输入为 278 samples、130 source genus categories、570,851 reads，library depth 53–10,585、median 1,597.5
      - 主 DMM 使用 raw non-negative integer counts，不转 relative abundance、不加 pseudocount、不 rarefy；candidate k 固定 1–7，seed 固定 20260729
      - fresh-fit Laplace minimum 选择 k=4，四个 canonical states 按 fitted Bacteroides、Prevotella 比例排序为 DMM-A 至 DMM-D，样本量为 85、86、46、61；最小 state 46 大于预声明门槛 14
      - AIC minimum 为 k=2、BIC minimum 为 k=1，必须与 Laplace k=4 的准则分歧同图并列，不得只展示支持四分型的一个指标
      - package bundled reference fit 与 fresh fixed-seed fit 的 Laplace 数值存在优化/近似差异但都选 k=4；该差异必须保留，不能把 bundled object 冒充本次 fresh fit
      - k=4 在 seeds 20260729–20260736 的八个 one-shot、single-thread R-process fresh starts 中全部进入与主模型相同的 assignment basin，pairwise 与 primary ARI 均为 1；最低 Laplace 的 seed 20260735 也得到同一 partition，label switching 先按 component profile 匹配再比较，worker 不跨 fit 复用
      - sample posterior 表保留每个 state 的 probability、maximum probability 与 normalized entropy；低置信度样本不得被画成确定边界
      - 5% prevalence 分支仍由 Laplace 选择 k=4；depth ≥1,000、seed-locked 1,000-read rarefaction 和 one-sample-per-participant 分支均选择 k=2；固定 k=4 时相对主模型的 matched ARI 约为 0.904、0.928、0.906 与 0.680，所有分支保存 overlap 与 profile divergence 且不替换主 counts 分析
      - metadata 显示 154 个 suffix-derived ParticipantKey、124 组双时点样本、26 个 no-suffix-only 与 4 个 suffix-only key；重复样本只报告 state agreement/transition，不把 suffix 当作经过独立验证的临床访视时间
      - BMIClass 仅作描述性交叉表；缺少 family/household、连续 BMI、饮食、药物及完整 visit metadata 时不运行或解释疾病关联检验
      - 四张英文原创图各导出 PDF/SVG/600 ppi PNG/LZW-TIFF，并通过物理尺寸、像素、字体、SVG 文本与 TIFF 压缩审计
      - 正文明确区分 Holmes et al. 原始分析合同与当前升级项，目标图链接、原始做法、多初始化、标签匹配、后验不确定性和稳定性审计均可追溯
    common_failures:
      - 把相对丰度、CLR、加伪计数或抽平表传给要求 raw counts 的 DMM 主模型
      - 只凭最低 Laplace 或二维 PCoA 颜色块宣布存在四个稳定、互斥、天然的肠型
      - 未预声明 candidate k，看到结果后扩大或缩小搜索范围以获得想要的类别数
      - 直接比较不同拟合的 component number，忽略 mixture label switching
      - 只报告 hard assignment，不保留 posterior probability、entropy 与边界样本
      - 过滤低 prevalence taxa 或去除浅测序样本后不重新拟合、不报告分类稳定性
      - 把同一参与者的重复样本当作独立证据运行普通卡方检验或疾病关联模型
      - 用优势菌命名 state 后把相关组成模式写成病因、功能或绝对丰度变化
    outputs:
