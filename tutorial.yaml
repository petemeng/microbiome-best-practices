  - id: validate-primer-trimming-and-region-branches
    title: 一次性验证第 11 篇去引物与引物区分支合同
    goal: >
      从固定 nf-core/ampliseq V4 双端原始 FASTQ 独立导入，先审计 515F/806R
      是否真实存在，再用锚定、IUPAC 感知和最小 15-nt overlap 的 q2-cutadapt
      去除引物；同时用 Atacama EMP reads 证明“同为 V4”并不等于“reads 中仍有
      引物”，并将 V4、V3–V4、全长以及单双端选择整理为可执行分支。
    rationale: >
      引物名称、扩增区域、测序结构和 reads 中是否保留引物是四个不同问题。
      先做匹配率探针再决定 trim/skip，可防止错误引物或错误方向在
      --p-discard-untrimmed 下把整个研究清空；严格锚定还可避免内部偶然命中
      被误当作 5′ 引物。
    inputs:
      - env/qiime2.yml
      - data/small/primer-trimming/1_S103_L001_R1_001.fastq.gz
      - data/small/primer-trimming/1_S103_L001_R2_001.fastq.gz
      - data/small/primer-trimming/1a_S103_L001_R1_001.fastq.gz
      - data/small/primer-trimming/1a_S103_L001_R2_001.fastq.gz
      - data/small/primer-trimming/2_S115_L001_R1_001.fastq.gz
      - data/small/primer-trimming/2_S115_L001_R2_001.fastq.gz
      - data/small/primer-trimming/2a_S115_L001_R1_001.fastq.gz
      - data/small/primer-trimming/2a_S115_L001_R2_001.fastq.gz
      - data/small/primer-trimming/source_summary.json
      - data/small/fastq/forward.fastq.gz
      - data/small/fastq/reverse.fastq.gz
      - data/small/fastq/source_summary.json
      - scripts/validate_primer_trimming.py
    command: |
      set -eu
      mkdir -p \
        "${RUN_ROOT}/results/11-primer-trimming" \
        "${RUN_ROOT}/figures"
      python3 "${MANIFEST_DIR}/scripts/validate_primer_trimming.py" \
        --project-root "${MANIFEST_DIR}" \
        --output-dir "${RUN_ROOT}/results/11-primer-trimming" \
        --figure-dir "${RUN_ROOT}/figures" \
        --qiime-env microbiome-qiime2-2026.4
    expected_outputs:
      - results/11-primer-trimming/nfcore-v4-manifest.tsv
      - results/11-primer-trimming/nfcore-v4-demux.qza
      - results/11-primer-trimming/nfcore-v4-demux-summary.qzv
      - results/11-primer-trimming/nfcore-v4-trimmed.qza
      - results/11-primer-trimming/nfcore-v4-trimmed-summary.qzv
      - results/11-primer-trimming/primer-source-audit.tsv
      - results/11-primer-trimming/primer-match-audit.tsv
      - results/11-primer-trimming/trim-retention-audit.tsv
      - results/11-primer-trimming/length-shift-audit.tsv
      - results/11-primer-trimming/parameter-sensitivity.tsv
      - results/11-primer-trimming/region-branch-decision.tsv
      - results/11-primer-trimming/primer-provenance-audit.tsv
      - results/11-primer-trimming/atacama-no-primer-probe.log
      - results/11-primer-trimming/qiime-cutadapt.log
      - results/11-primer-trimming/primer-summary.json
      - results/11-primer-trimming/validation.log
      - figures/11-primer-presence-gate.pdf
      - figures/11-primer-presence-gate.png
      - figures/11-primer-presence-gate.tiff
      - figures/11-trimming-retention-audit.pdf
      - figures/11-trimming-retention-audit.png
      - figures/11-trimming-retention-audit.tiff
      - figures/11-primer-read-architecture.pdf
      - figures/11-primer-read-architecture.png
      - figures/11-primer-read-architecture.tiff
      - figures/11-region-branch-decision.pdf
      - figures/11-region-branch-decision.png
      - figures/11-region-branch-decision.tiff
    acceptance_checks:
      - QIIME 2/q2cli/q2-cutadapt 为 2026.4.0，底层 Cutadapt 为 5.2
      - nf-core/test-datasets 固定提交的 8 个 FASTQ 均与 source_summary.json 的 SHA-256、字节数和 2,500 records 一致
      - 4 个样本的 R1/R2 read ID 顺序完全同步，共 10,000 对输入 reads
      - 正例独立导入为 SampleData[PairedEndSequencesWithQuality]，通过 maximum validation
      - q2-cutadapt 使用 ^GTGYCAGCMGCCGCGGTAA 与 ^GGACTACNVGGGTWTCTAAT、error-rate 0.1、overlap 15、discard-untrimmed
      - 锚定正确引物保留 8,614/10,000 对 reads（86.14%），4 个样本的 R1/R2 输出继续同步
      - 每个样本裁剪后 R1 与 R2 的典型长度分别减少约 19 nt 与 20 nt，不重复在 DADA2 中 trim-left
      - 不锚定正确引物保留 8,627 对，比锚定多 13 对；这些额外内部/前置命中只作为敏感性结果，不作为默认主线
      - 用 V3–V4 341F/805R 错误引物处理 V4 正例时保留 0 对，证明引物序列不可凭区域名称猜测
      - Atacama 原始 V4 reads 对原始 515F/806R 的双端锚定匹配为 0/2,000，因此主决策为 skip trimming
      - trimmed Artifact 的 provenance 同时保留 import 与 cutadapt action，参数和输入 UUID 可回查
      - 50/50 项工具、字节、FASTQ、匹配、Artifact、provenance、长度和图形检查通过
      - 四张英文证据图同时导出 PDF、PNG 与 350 dpi LZW TIFF
    common_failures:
      - 只看“V4”标签就假设 515F/806R 一定仍在 reads 中
      - 把带 Illumina overhang、index、linker 或 barcode 的整条建库寡核苷酸当作生物学引物
      - 双端数据只提供一个方向的引物，却把 discard-untrimmed 的保留率当作成对匹配率
      - 用 anywhere 或不锚定搜索作为默认值，误切内部同源片段
      - 忘记 IUPAC 简并碱基，或把 R2 错写成 reverse complement 后再交给 front-r
      - 去引物后又在 DADA2 使用同样长度的 trim-left，造成二次删除
      - 把 10,000-pair 教学数据的 86.14% 保留率当作所有项目的固定质控阈值
    outputs:
      - results/11-primer-trimming/nfcore-v4-trimmed.qza
      - results/11-primer-trimming/primer-source-audit.tsv
      - results/11-primer-trimming/primer-match-audit.tsv
      - results/11-primer-trimming/trim-retention-audit.tsv
      - results/11-primer-trimming/length-shift-audit.tsv
      - results/11-primer-trimming/parameter-sensitivity.tsv
      - results/11-primer-trimming/region-branch-decision.tsv
      - results/11-primer-trimming/primer-provenance-audit.tsv
      - results/11-primer-trimming/primer-summary.json
      - results/11-primer-trimming/validation.log
      - figures/11-primer-presence-gate.png
      - figures/11-trimming-retention-audit.png
      - figures/11-primer-read-architecture.png
      - figures/11-region-branch-decision.png
    method_basis:
      type: project-experience
      summary: >
        将公开、保留引物的 V4 MiSeq 数据作为正例，将不含引物的 Atacama
        V4 数据作为反例；先以锚定匹配率审计是否应裁剪，再运行 QIIME 2
        Artifact 工作流并用独立 Cutadapt 敏感性分支验证方向、区域和锚定选择。
    references:
      - title: q2-cutadapt plugin reference
        type: software-documentation
        url: https://amplicon-docs.qiime2.org/en/2026.4/references/plugins/cutadapt/
      - title: Cutadapt 5.2 documentation
        type: software-documentation
        url: https://cutadapt.readthedocs.io/en/stable/
      - title: Earth Microbiome Project 16S Illumina Amplicon Protocol
        type: protocol
        url: https://earthmicrobiome.org/protocols-and-standards/16s/
      - title: nf-core/test-datasets primer-retained MiSeq v2 data
        type: data-repository
        url: https://github.com/nf-core/test-datasets/tree/f282ad2bafb3ca90190ec87290066ee1985df655/testdata
      - title: nf-core/ampliseq
        type: software-documentation
        url: https://github.com/nf-core/ampliseq/tree/2723d4c298d48321594920d0324697e14d73ee94
      - title: Interpretations of environmental microbial community studies are biased by the selected 16S rRNA gene amplicon sequencing pipeline
        type: method-paper
        citation: Straub D, Blackwell N, Langarica-Fuentes A, et al. Frontiers in Microbiology. 2020;11:2652.
      - title: Improved bacterial 16S rRNA gene V4 and V4–5 and fungal ITS marker gene primers for microbial community surveys
        type: method-paper
        citation: Walters W, Hyde ER, Berg-Lyons D, et al. mSystems. 2016;1(1):e00009-15.
      - title: Evaluation of general 16S ribosomal RNA gene PCR primers for classical and next-generation sequencing-based diversity studies
        type: method-paper
        citation: Klindworth A, Pruesse E, Schweer T, et al. Nucleic Acids Research. 2013;41(1):e1.
      - title: Significant impacts of increasing aridity on the arid soil microbiome
        type: data-paper
        citation: Neilson JW, Califf K, Cardona C, et al. mSystems. 2017;2(3):e00195-16.
