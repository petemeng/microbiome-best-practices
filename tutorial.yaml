  - id: validate-taxonomy-database-choice
    title: 一次性验证第 14 篇 SILVA、GTDB 与 Greengenes2 数据库合同
    cache_revision: article-14-taxonomy-databases-v1
    goal: >
      固定 SILVA 138.2 SSURef NR99、GTDB R11-RS232 species-representative
      16S 与 Greengenes2 2024.09 backbone，审计三个完整发布的来源、许可证、
      序列规模、rank schema、命名完整度与 515F/806R 区域可提取性；再把同一组
      366 个真实 V4 ASV 用同一套 q2-feature-classifier
      classify-consensus-vsearch 参数独立注释，量化逐 rank assignment、
      organelle/off-target 与跨数据库命名分歧。
    rationale: >
      参考数据库不是可以互换的标签字典。SILVA 以 SSU 序列整理为核心，GTDB
      taxonomy 来自 genome phylogeny 且 16S 只是从代表基因组提取，
      Greengenes2 把 genome backbone、全长 16S 和大规模 V4 ASV 放进统一树。
      为避免把分类器、扩增区域和数据库效应混在一起，本篇固定相同 query、
      相同 primer extraction 与相同 consensus-VSEARCH 决策；与当前
      scikit-learn 1.7.1 匹配的区域 Naive Bayes 训练留到第 15 篇。
