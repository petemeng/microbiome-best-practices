      - 122/122 项环境、输入、参数、结果、Artifact、provenance、失败分支和图形检查通过
      - 四张英文证据图同时导出 PDF、PNG 与 350 dpi LZW TIFF
    common_failures:
      - 沿用去引物前的 cycle 坐标，导致 trim-left 二次删除生物序列
      - 只看 forward read 质量，不检查 reverse read 与 paired overlap
      - 为追求更高 filtered 数过度截短，最终 merge 并未改善
      - 把 ASV 数最多当成唯一最优标准，忽略嵌合体、长度异常和低质量误差
      - 只保存 feature table，不保存代表序列、stats、base transitions、QZV 和 provenance
      - 把本数据的 220/200 参数或 60.52% 保留率当作其他 run 的固定阈值
