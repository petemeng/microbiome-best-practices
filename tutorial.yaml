  - id: validate-core-rare-biosphere
    title: 实跑并验证第 28 篇核心菌群与稀有生物圈合同
    cache_revision: article-28-core-rare-biosphere-v1
    goal: >
      从 microeco 2.0.0 分发的真实中国湿地 16S otutab、taxonomy、metadata
      三件套独立开始，在 feature/OTU 层计算 abundance–occupancy。主 core 明确固定为
      单样本 all-read relative abundance 至少 0.01%、且在至少 80% 样本检出；全局 core、
      三个湿地组内 core 与 shared/group-specific membership 分开保存。同步区分 primary core、
      conditionally rare、persistently rare、sampling-limited tail 与 intermediate features，
      并生成 occupancy–abundance、组内 core membership、阈值/深度敏感性和 rare-mass 四张图。
    rationale: >
      “核心”与“稀有”不是数据自带标签，而是由 feature resolution、检测阈值、prevalence、
      样本集合和测序深度共同决定的操作性分类。把这些选择、等样本分母、固定深度分支和
      低证据尾部写成可执行合同，才能避免把一次检出写成稳定定殖、把低 read count 写成
      生态稀有，或把不同组的 core 交集误当作未经阈值审计的普适核心。
    inputs:
      - env/renv.lock
      - data/small/otutab.tsv
      - data/small/taxonomy.tsv
      - data/small/metadata.tsv
      - data/small/source_summary.json
      - R/theme_pub.R
      - scripts/prepare_pilot_data.R
      - scripts/validate_core_rare_biosphere.R
      - chapters/28-core-rare-biosphere.qmd
    command: |
