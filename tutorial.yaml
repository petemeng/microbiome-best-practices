    acceptance_checks:
      - SILVA 138.2、GTDB R11-RS232 与 Greengenes2 2024.09 的官方 URL、license、checksum、release notes 与完整 source counts 被分别锁定
      - GTDB R232 release notes 中 barnap/396-bp 新合同与旧通用 FILE_DESCRIPTIONS 的 nhmmer/200-bp 文本分开记录，并以实际序列长度审计为准
      - Greengenes2 2024.09 明确记录其 taxonomy 基于 GTDB R220 与 LTP 08/2023，而不是误写成当前 GTDB R232
