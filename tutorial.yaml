    acceptance_checks:
      - 三件套、来源摘要、准备脚本和共享作图函数逐文件 SHA-256 全部锁定；输入为 13,628 features、90 samples、1,619,670 reads，三组各 30 个样本
      - Phylum、Class、Order、Family、Genus 分别有 56、128、217、394、772 个含 Unknown 的唯一标签；五级聚合后每个样本均精确闭合到 1
      - 五级已命名 reads 的等样本均值依次约为 0.99654、0.96798、0.85573、0.67963、0.36894；最大分辨率损失发生在 Family→Genus，为 31.068 percentage points
      - Inland、Coastal、Tibetan wetland 的 genus-level known fractions 分别约为 0.28991、0.38385、0.43307；正文必须保留这种组间注释完整性差异
      - 空 rank 不向下或向上填充；前三个 parent→child transition 无 child-known/parent-unknown 记录，而 Family→Genus 明确保留 324 个 features、17 个 genera 和 0.02518 的等样本 reads
      - 完整 Phylum→Genus lineage 覆盖 0.34376 的全部 reads；top 12 完整 genus lineages 覆盖 0.10188，展示名单不能替代完整 754-lineage 导出
      - 联合表使用 rank-qualified labels；13 个跨 rank 同名标签不被合并，Family 层的两个多父系裸名称也使用完整 parent path 区分
      - 每级 Top 5 只按 90 个样本的全局等权均值选择并固定用于三组；气泡大小为 all-read mean abundance，颜色为 prevalence
      - Top-N sensitivity 固定 N=5、10、20、50 与 All known 五个分支；Top 10 对 Phylum、Class、Order、Family、Genus 的平均覆盖率依次约为 0.94803、0.59005、0.34765、0.23671、0.09522
      - 组均值主结果先逐样本闭合再等权平均；pooled-read weighting 和 known-only denominator 仅为敏感性分支，最大 known-only 放大保留为审计结果
      - "`Incertae Sedis` 保留为来源数据库给出的 unresolved named placement，不静默改成 Unknown，也不写成已解决的标准分类单元"
      - 四张英文原创图各导出 PDF/SVG/600 ppi PNG/LZW-TIFF，并通过物理尺寸、像素、字体、SVG 文本与 TIFF 压缩审计
    common_failures:
      - 直接按裸 taxon 名跨 rank 合并，使 Phylum `Acidobacteria` 与 Class `Acidobacteria` 变成同一行
      - 为了画漂亮层级图，把 Unknown family 用已知 genus 反推并虚构一个父级
      - 把同一批 reads 在门、纲、目、科、属的比例相加，得到超过 100% 的所谓总丰度
      - 每个组或每个 rank 独立挑 Top-N，却仍用同一颜色或位置暗示可直接比较
      - 删除 Unknown 后重新闭合，再把 known-only 比例写成全部 reads 的 relative abundance
      - 把 `Incertae Sedis` 当作完全解析的标准命名，或与真正空注释混为一类
      - 把 lineage ladder、注释率差异或描述性气泡图当作差异丰度检验
      - 用 genus-level 低注释率否定所有上层级结果，或反过来用 phylum 注释率替代 genus 可解析度
    outputs:
