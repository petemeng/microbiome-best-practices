  - id: validate-beta-distances
    title: 实跑并验证第 21 篇六类 Beta 距离、根树与零值处理合同
    cache_revision: article-21-beta-distances-v1
    goal: >
      从 phyloseq 1.48.0 分发的真实 GlobalPatterns 16S 数据导出的 otutab、
      taxonomy、metadata 三件套和精确同 tip rooted tree 独立开始。用同一份
      seed 20260722、50,000 reads 稀释表比较 Bray-Curtis、binary Jaccard、
      unweighted UniFrac 与 weighted UniFrac；在未稀释计数上对相同的
      total-count/prevalence feature 集计算 pseudocount CLR Aitchison 与由
      gemelli 0.0.13 observed-only rclr/RPCA 得到的 Robust Aitchison，审计
      伪计数敏感性、距离相关、PCoA 负特征值和四张英文出版图。
    rationale: >
      Beta distance 不是作图菜单，而是对“什么差异算远”的测量定义。
      abundance、presence/absence、phylogeny 与 log-ratio geometry 回答不同问题，
      也要求不同的标准化和输入门禁。把所有方法先转成同一种相对丰度或对所有
      feature 机械加伪计数，会掩盖这些差异；没有 root、branch length 与精确 tip
      对齐时，UniFrac 也没有可解释的系统发育意义。
    inputs:
      - env/renv.lock
      - env/gemelli.yml
      - env/gemelli-requirements.txt
      - data/small/beta-distances/otutab.tsv
      - data/small/beta-distances/taxonomy.tsv
      - data/small/beta-distances/metadata.tsv
      - data/small/beta-distances/rooted-tree.nwk.gz
      - data/small/beta-distances/source-summary.json
      - R/theme_pub.R
      - scripts/prepare_beta_distance_data.R
      - scripts/run_gemelli_rpca.py
      - scripts/validate_beta_distances.R
    command: |
      set -eu
      mkdir -p \
        "${RUN_ROOT}/results/21-beta-distances" \
        "${RUN_ROOT}/figures"
      GEMELLI_PYTHON="${MANIFEST_DIR}/.tools/gemelli-0.0.13/bin/python"
      test -x "${GEMELLI_PYTHON}"
      Rscript --vanilla "${MANIFEST_DIR}/scripts/validate_beta_distances.R" \
        --project-root "${MANIFEST_DIR}" \
        --input-dir "${MANIFEST_DIR}/data/small/beta-distances" \
        --output-dir "${RUN_ROOT}/results/21-beta-distances" \
        --figure-dir "${RUN_ROOT}/figures" \
        --gemelli-python "${GEMELLI_PYTHON}"
    expected_outputs:
      - results/21-beta-distances/beta-distances-summary.json
