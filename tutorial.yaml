publication:
  repo:
    mode: bundle
    target_dir: rendered/github_bundle
    include_paths:
      - tutorial.yaml
      - _quarto.yml
      - index.qmd
      - chapters
      - R
      - data/small
      - figures
      - env
      - scripts
    public_url: https://github.com/petemeng/microbiome-best-practices
  wechat:
    mode: filesystem
    draft_dir: rendered/wechat_bundle
    tags:
      - 16S
      - 微生物组
      - 最佳实践
    summary: >
      55 篇 16S 微生物组分析最佳实践系列；每篇公众号文章保留完整数据入口、
      依赖、分析代码、结果解释和发表级重绘图。
series:
  total_articles: 55
  source_format: qmd
  website_source_of_truth: true
  wechat_self_contained: true
  paper_figure_policy: redraw-from-public-data
  chapters:
    - {number: 1, file: index.qmd, title: "开篇：这套教程你将复现哪些顶刊图（图集预览 + 学习地图）"}
    - {number: 2, file: chapters/02-scope-and-limits.qmd, title: "16S 能回答什么、回答不了什么（vs 宏基因组 / 其他组学）"}
    - {number: 3, file: chapters/03-study-design.qmd, title: "实验设计：样本量、统计效力、分组与配对"}
    - {number: 4, file: chapters/04-contamination-controls.qmd, title: "污染与对照：blank、kitome、低生物量、decontam"}
    - {number: 5, file: chapters/05-batch-effects.qmd, title: "批次效应：来源、检测与校正策略"}
    - {number: 6, file: chapters/06-data-and-fastq.qmd, title: "认识你的数据：测序原理 + FASTQ / 文件格式拆解"}
    - {number: 7, file: chapters/07-wsl2-conda.qmd, title: "WSL2 + conda/mamba（Windows 用户主线）"}
    - {number: 8, file: chapters/08-qiime2-install.qmd, title: "安装 QIIME2 + 验证 + 报错对照"}
    - {number: 9, file: chapters/09-r-ecosystem.qmd, title: "安装 R/RStudio + 关键包生态（phyloseq/microeco/tidyverse）"}
    - {number: 10, file: chapters/10-import-provenance-qc.qmd, title: "导入数据 + provenance + 质控（FastQC/MultiQC）"}
    - {number: 11, file: chapters/11-primer-trimming.qmd, title: "去引物 + 引物区分支决策（V4 / V3–V4 / 全长 / 单双端）"}
    - {number: 12, file: chapters/12-dada2-asv.qmd, title: "DADA2 出 ASV（截断参数怎么定）"}
    - {number: 13, file: chapters/13-its-18s.qmd, title: "ITS/18S 特殊处理（ITSxpress、UNITE、PR2）"}
    - {number: 14, file: chapters/14-taxonomy-databases.qmd, title: "物种注释 + 数据库选择（SILVA/GTDB/Greengenes2）"}
    - {number: 15, file: chapters/15-train-classifier.qmd, title: "训练你自己引物区的分类器"}
    - {number: 16, file: chapters/16-sepp-phylogeny.qmd, title: "系统发育树（SEPP fragment insertion）"}
    - {number: 17, file: chapters/17-phyloseq-import.qmd, title: "导出到 R：构建 phyloseq 对象、数据结构详解"}
    - {number: 18, file: chapters/18-publication-graphics.qmd, title: "出版级作图地基：ggplot2 主题、色盲友好配色、字体、PDF/SVG 矢量 + TIFF/PNG 300–600 ppi 导出"}
    - {number: 19, file: chapters/19-alpha-diversity.qmd, title: "Alpha 指数全家 + 稀释曲线 + 抽平之争 + Hill numbers"}
