  - id: validate-articles-51-55-release
    title: 验证第 51–55 篇发布资产与因果边界合同
    cache_revision: articles-51-55-longitudinal-causal-release-v1
    goal: >
      对五篇 HTML、二十张主图、八十个格式文件、三套新增真实数据、
      纵向/SEM/中介/MR 原生方法环境与因果证据阅读框架执行独立发布门禁。
    rationale: >
      重复测量和因果推断容易在独立性、时间顺序、工具变量假设、未测混杂与措辞强度上
      静默越界，因此需共同锁定正文、数据、环境、图形、关键数值和不可得诊断。
    inputs:
      - scripts/validate_articles_51_55.py
      - env/renv.lock
      - data/small/longitudinal-dietswap/source-summary.json
      - data/small/paired-ibd-multiomics/source-summary.json
      - data/small/mr-mibiogen/source-summary.json
      - data/small/causal-evidence/source-summary.json
      - chapters/51-longitudinal-analysis.qmd
      - chapters/52-structural-equation-model.qmd
      - chapters/53-mediation-analysis.qmd
      - chapters/54-mendelian-randomization.qmd
      - chapters/55-causal-evidence.qmd
      - pilot/_site/chapters/51-longitudinal-analysis.html
      - pilot/_site/chapters/52-structural-equation-model.html
      - pilot/_site/chapters/53-mediation-analysis.html
      - pilot/_site/chapters/54-mendelian-randomization.html
      - pilot/_site/chapters/55-causal-evidence.html
    command: |
      set -eu
      mkdir -p "${RUN_ROOT}/results"
      python3 "${MANIFEST_DIR}/scripts/validate_articles_51_55.py" \
        --project-root "${MANIFEST_DIR}" \
        --site-root "${RUN_ROOT}/pilot" \
        --output "${RUN_ROOT}/results/articles-51-55-validation.json"
    expected_outputs:
      - results/articles-51-55-validation.json
    acceptance_checks:
      - 第 51–54 篇为 eval:true、freeze:auto，含九段结构、内联作图函数、固定 seed 和本篇输入；第 55 篇为 eval:false 的可追溯阅读框架
      - 二十张主图的八十个 PDF/SVG/PNG/TIFF 文件存在；位图至少 590 ppi、TIFF LZW、SVG 无中文图内文字
      - DietSwap 222 observations/38 subjects、湿地 90 samples、Franzosa 中介子集 108 samples、MiBioGen/GWAS 6 个候选工具和七项证据案例与来源摘要一致
      - 418-package R 锁包含 piecewiseSEM 2.3.0.1、plspm 0.6.0、mediation 4.5.1、TwoSampleMR 0.6.6 与 MRPRESSO 1.0
      - AR(1)、SEM 竞争图、ACME 区间、MR harmonisation/敏感性和证据措辞 ledgers 与正文一致
    common_failures:
      - 把重复测量当独立样本，或只画 spaghetti plot 而不审计 subject correlation
      - 依据同一批数据反复改 DAG 后只报告最终图，或把显著路径自动解释为因果
      - 横断面中介缺少时间顺序却写成机制，或 MR 缺少 harmonisation、弱工具和 pleiotropy 审计
      - 把第 55 篇证据阶梯当作机械评分，忽略不同设计的残余偏倚结构
