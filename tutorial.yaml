    title: 验证第 36–40 篇发布资产与结果合同
    cache_revision: articles-36-40-release-assets-v1
    goal: >
      对隔离 pilot 站点中的五篇 HTML、二十张主图、八十个格式文件、
      真实湿地根树、R 包锁与关键网络/群落构建/宏生态结果执行独立发布门禁。
    rationale: >
      可执行成功不会自动发现图例裁切、taxonomy 标签丢失、并行 RNG 漂移或
      结果口径错配；发布门禁必须同时检查正文、图形、输入、环境和结果 ledger。
