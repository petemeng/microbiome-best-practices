    method_basis:
      type: external-benchmark
      summary: >
        以 An et al. 的中国湿地 16S 群落为数据锚点，以 abundance–occupancy 作为可复查的
        core 主框架，并参考 Custer et al. 对 core assignment 方法的实证/模拟比较、Salonen
        et al. 对 analysis depth 的警示和 Shade et al. 对 conditionally rare taxa 的动态定义；
        所有阈值均作为本数据集的操作性合同与敏感性网格，而不是通用生态常数。
