      - title: microeco - an R package for data mining in microbial community ecology
        type: software-paper
        citation: Liu C, Cui Y, Li X, Yao M. FEMS Microbiology Ecology. 2021;97:fiaa255. doi:10.1093/femsec/fiaa255.
      - title: Variation partitioning of species data matrices
        type: method-paper
        citation: Peres-Neto PR, Legendre P, Dray S, Borcard D. Ecology. 2006;87:2614-2625. doi:10.1890/0012-9658(2006)87[2614:VPOSDM]2.0.CO;2.
      - title: Dismantling the Mantel tests
        type: method-paper
        citation: Guillot G, Rousset F. Methods in Ecology and Evolution. 2013;4:336-344. doi:10.1111/2041-210X.12018.
