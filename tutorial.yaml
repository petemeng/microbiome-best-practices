  - id: validate-articles-30-35-release
    title: 验证第 30–35 篇发布资产与结果合同
    cache_revision: articles-30-35-release-assets-v1
    goal: >
      对隔离 pilot 站点中的六篇 HTML、十九张主图、七十六个格式文件、
      两套真实数据合同、R 包锁与关键统计结果执行独立发布门禁。
    rationale: >
      QMD 成功执行只能证明代码完成；发布前仍需逐文件核对格式签名、600 ppi、
      TIFF LZW、SVG 英文文字、HTML 内容和结果口径，防止渲染或派生阶段静默漂移。
    inputs:
      - scripts/validate_articles_30_35.py
      - env/renv.lock
      - data/small/otutab.tsv
      - data/small/absolute-quantification/otutab.tsv
      - data/small/absolute-quantification/source-summary.json
      - chapters/30-compositional-data.qmd
      - chapters/31-da-methods.qmd
      - chapters/32-multirank-da.qmd
      - chapters/33-da-visualization.qmd
      - chapters/34-absolute-quantification.qmd
      - chapters/35-cooccurrence-networks.qmd
      - pilot/_site/chapters/30-compositional-data.html
      - pilot/_site/chapters/31-da-methods.html
      - pilot/_site/chapters/32-multirank-da.html
      - pilot/_site/chapters/33-da-visualization.html
      - pilot/_site/chapters/34-absolute-quantification.html
      - pilot/_site/chapters/35-cooccurrence-networks.html
    command: |
      set -eu
      mkdir -p "${RUN_ROOT}/results"
      python3 "${MANIFEST_DIR}/scripts/validate_articles_30_35.py" \
        --project-root "${MANIFEST_DIR}" \
        --site-root "${RUN_ROOT}/pilot" \
        --output "${RUN_ROOT}/results/articles-30-35-validation.json"
    expected_outputs:
      - results/articles-30-35-validation.json
    acceptance_checks:
      - 六篇下游文章均为 eval:true、freeze:auto，含完整结构与固定 seed
      - 六篇 HTML 和十九张主图存在，七十六个 PDF/SVG/PNG/TIFF 文件均通过
      - PNG/TIFF 至少 590 ppi，TIFF 使用 LZW，SVG 无中文图内文字
      - 湿地与 Vandeputte 输入维度、reads、来源 SHA-256 和 418 条 R 锁记录一致
      - 五方法命中数、Species 注释门禁、Desulfovibrio QMP 示例和网络边数/稳定性与正文一致
    common_failures:
      - 单篇 HTML 未在 pilot 目录生成或图形路径断裂
      - 位图 ppi、TIFF 压缩、SVG 文字或文件签名不符合发布合同
      - 重跑后统计结果变化但 Methods、README 或图题未同步
      - 新增包未进入 env/renv.lock，或 SPIEC-EASI commit 漂移
    outputs:
      - results/articles-30-35-validation.json
    method_basis:
      type: project-experience
      summary: 发布资产门禁把可执行分析、图形格式、真实数据与文字声明收束到同一机器可读报告。
    references:
      - title: Quarto Books documentation
        type: software-documentation
        url: https://quarto.org/docs/books/
    assertions:
      - id: articles-30-35-validation-passed
        type: metric_threshold
        path: results/articles-30-35-validation.json
        key: checks_failed
        comparator: "=="
        value: 0
      - id: articles-30-35-validation-checks
        type: metric_threshold
        path: results/articles-30-35-validation.json
        key: checks_passed
        comparator: "=="
        value: 359
      - id: articles-30-35-primary-figures
        type: metric_threshold
        path: results/articles-30-35-validation.json
        key: primary_figure_count
        comparator: "=="
        value: 19
      - id: articles-30-35-format-files
        type: metric_threshold
        path: results/articles-30-35-validation.json
        key: format_file_count
        comparator: "=="
        value: 76
