  - id: validate-permanova-dispersion
    title: 实跑并验证第 23 篇 PERMANOVA、受限置换与组内离散度合同
    cache_revision: article-23-permanova-dispersion-v1
    goal: >
      从 phyloseq 1.48.0 分发的真实 soilrep 16S 数据导出的 otutab、taxonomy、
      metadata 三件套独立开始，不读取第 22 篇结果。先把 56 个 PCR/tag 技术库
      聚合到 24 个生物学土壤样本，复原 6-block warming × clipping split-plot
      设计；预先固定论文对应的 feature prevalence 规则、相对丰度 Bray-Curtis
      和 seed 20260723，再用 9,999 个唯一合法置换运行 blocked PERMANOVA、
      betadisper/permutest、四个计划 simple-effect pairwise PERMANOVA 与 Holm
      校正，并把 ANOSIM/MRPP 限定为同距离、同置换设计的次要敏感性分析。
    rationale: >
      PERMANOVA 的 P 值只有在置换单位与实验随机化单位一致时才成立。把同一土壤
      DNA 的技术标签库当成独立样本会产生伪重复；自由置换也会破坏 paired nested
      设计。即使受限 PERMANOVA 显著，仍可能混入组内离散度差异，因此必须把
      centroid location、dispersion、R2、置换空间和多重比较分开报告。
