      - data/small/phyloseq-import/rooted-insertion-tree.nwk.gz
      - data/small/phyloseq-import/source-summary.json
      - scripts/validate_phyloseq_import.R
    command: |
      set -eu
      mkdir -p \
        "${RUN_ROOT}/results/17-phyloseq-import" \
        "${RUN_ROOT}/figures"
      Rscript --vanilla "${MANIFEST_DIR}/scripts/validate_phyloseq_import.R" \
        --project-root "${MANIFEST_DIR}" \
        --input-dir "${MANIFEST_DIR}/data/small/phyloseq-import" \
        --output-dir "${RUN_ROOT}/results/17-phyloseq-import" \
        --figure-dir "${RUN_ROOT}/figures"
