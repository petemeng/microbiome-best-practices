  - id: validate-multirank-composition
    title: 实跑并验证第 27 篇门到属多分类级组成合同
    cache_revision: article-27-multirank-composition-v1
    goal: >
      从 microeco 2.0.0 分发的真实中国湿地 16S otutab、taxonomy、metadata
      三件套独立开始，在 Phylum、Class、Order、Family、Genus 五级分别闭合、聚合
      和汇总。所有联合表使用 rank-qualified taxon label 与显式 lineage key，空注释
      保留为 rank-specific Unknown，不回填缺失父级；生成注释分辨率阶梯、多层级
      Top-5 气泡图、完整优势 lineage ladder 与跨层级 Top-N coverage 图，并同步审计
      层级断裂、同名冲突、完整 lineage、样本权重和 known-only denominator。
    rationale: >
      不同分类级并不是同一变量的不同缩放。随层级加深，注释率、标签数和 Top-N
      覆盖率都会改变；裸 taxon 名还可能在不同 rank 或不同父系中重复。把 rank、
      lineage、Unknown、分母与选择规则固定成可执行合同，才能避免错误合并、虚构父级、
      双重计数，或把同一条 read 在多个 rank 的比例相加。
    inputs:
      - env/renv.lock
      - data/small/otutab.tsv
      - data/small/taxonomy.tsv
      - data/small/metadata.tsv
      - data/small/source_summary.json
      - R/theme_pub.R
      - scripts/prepare_pilot_data.R
      - scripts/validate_multirank_composition.R
      - chapters/27-multirank-composition.qmd
    command: |
      set -eu
      mkdir -p \
        "${RUN_ROOT}/results/27-multirank-composition" \
        "${RUN_ROOT}/figures"
      Rscript --vanilla "${MANIFEST_DIR}/scripts/validate_multirank_composition.R" \
        --project-root "${MANIFEST_DIR}" \
        --input-dir "${MANIFEST_DIR}/data/small" \
        --output-dir "${RUN_ROOT}/results/27-multirank-composition" \
        --figure-dir "${RUN_ROOT}/figures"
    expected_outputs:
