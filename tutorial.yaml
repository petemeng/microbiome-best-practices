  - id: validate-articles-41-45-release
    title: 验证第 41–45 篇发布资产与结果合同
    cache_revision: articles-41-45-release-assets-v1
    goal: >
      对五篇 HTML、二十张主图、八十个格式文件、三套新增真实数据、
      PICRUSt2/R 环境锁和功能预测/机器学习/meta/时间结局结果执行独立发布门禁。
    rationale: >
      功能预测、跨折建模、跨队列验证与 censored outcome 都可能在代码成功运行时
      仍发生输入错配、信息泄漏或解释越界，因此需把正文、数据、环境、图形和结果共同锁定。
    inputs:
      - scripts/validate_articles_41_45.py
      - env/renv.lock
      - env/picrust2.yml
      - data/small/picrust2-chemerin/source-summary.json
      - data/small/cross-cohort-crc/source-summary.json
      - data/small/survival-t1d/source-summary.json
      - chapters/41-picrust2.qmd
      - chapters/42-functional-guilds.qmd
      - chapters/43-random-forest.qmd
      - chapters/44-cross-cohort-validation.qmd
      - chapters/45-survival-analysis.qmd
