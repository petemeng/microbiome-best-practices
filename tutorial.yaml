      - results/15-train-classifier/holdout-taxonomy-c090.qza
      - results/15-train-classifier/holdout-evaluation-c070.qzv
      - results/15-train-classifier/query-taxonomy-c050.qza
      - results/15-train-classifier/query-taxonomy-c070.qza
      - results/15-train-classifier/query-taxonomy-c090.qza
