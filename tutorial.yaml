    acceptance_checks:
      - 官方 reference URL、50,161,069 bytes、SHA-256、UUID、SeppReferenceDatabase 语义类型与 SeppReferenceDirFmt 全部固定
      - reference 内 203,452 条 1,285-column aligned SSU 与 203,452-tip rooted tree 的 ID 完全一致，无负 branch length
      - QIIME 2、q2-fragment-insertion、SEPP、HMMER、pplacer、biom-format 与 DendroPy 版本通过精确审计
      - 366 条真实 V4 ASV 与 5,213 条 reads 的 FASTA/abundance checksum 和 ID 集合通过审计
      - SEPP 明确固定 alignment subset 1,000、placement subset 5,000、8 线程和绝对 runtime paths
      - rooted insertion tree、placements、输入/过滤/移除 tables 与 query sequences 六个 Artifact 均通过 maximum validation 和 required-action provenance
      - jplace 包含 366 个 placement names，候选位置 LWR 总和为 1，并报告 top LWR、pendant length、distal length 与候选位置数
      - 输出树有 203,818 tips，完整保留 203,452 reference tips 与 366 query tips，root degree 为 2，无缺失或负 branch lengths
      - 过滤后保留 366/366 ASV 与 5,213/5,213 reads，removed table 仍作为零损失证据保存
      - 明确把 LWR 解释为候选位置间相对支持，不作为校准后的正确概率；100% placement 不写成 100% reliable
      - 四张英文证据图同时导出 PDF、PNG 与 350 dpi LZW TIFF
    common_failures:
      - 把普通 FASTA、taxonomy 或 classifier Artifact 当作 SeppReferenceDatabase
      - 只写“Greengenes”而不固定 GG13_8 reference URL、checksum、UUID 与 legacy-backbone 边界
      - 使用相对 reference/cache/output 路径，SEPP 内部切换临时目录后找不到文件
      - 只保存 rooted tree，不保存 jplace 或 placement support 审计
      - 把所有 ASV 成功插入误写成所有位置唯一、正确或高支持
      - 不运行 filter-features，直接把原 table 与 tree 送进 Faith PD 或 UniFrac
      - 只报告 ASV retention，不报告 read-weighted retention 和 removed table
      - 用 QZA UUID、Newick/JSON byte hash 代替 tip set、per-query placement 和距离稳定性检查
