  - id: validate-dada2-asv-and-truncation
    title: 一次性验证第 12 篇 DADA2、截断与 ASV 输出合同
    goal: >
      从第 11 篇已通过 maximum validation 的真实去引物 V4 paired-end Artifact
      出发，以 q2-dada2 2026.4 比较五组截断与 maxEE 参数，固定主参数
      trunc-len 220/200、maxEE 2/2、minimum overlap 12，并审计逐样本损失账本、
      ASV 长度、Artifact 类型、provenance 和过度截断失败分支。
    rationale: >
      DADA2 参数不能只凭一张质量图或最大 ASV 数决定。过滤、去噪、合并和去嵌合
      四个阶段必须逐样本核对，同时用目标区域长度计算 overlap 预算；候选参数只有
      在保留率、信息长度、合并可行性和产物完整性共同通过时才能进入主分析。
    inputs:
      - env/qiime2.yml
      - results/11-primer-trimming/nfcore-v4-trimmed.qza
      - results/11-primer-trimming/nfcore-v4-trimmed-summary.qzv
      - scripts/validate_dada2_asv.py
    command: |
      set -eu
      mkdir -p \
        "${RUN_ROOT}/results/12-dada2-asv" \
        "${RUN_ROOT}/figures"
      python3 "${MANIFEST_DIR}/scripts/validate_dada2_asv.py" \
        --project-root "${MANIFEST_DIR}" \
        --input-artifact "${RUN_ROOT}/results/11-primer-trimming/nfcore-v4-trimmed.qza" \
        --input-summary "${RUN_ROOT}/results/11-primer-trimming/nfcore-v4-trimmed-summary.qzv" \
        --output-dir "${RUN_ROOT}/results/12-dada2-asv" \
        --figure-dir "${RUN_ROOT}/figures" \
