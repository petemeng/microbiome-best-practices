      - figures/17-taxonomy-coverage-audit.tiff
    acceptance_checks:
      - 七个独立输入资产逐文件 SHA-256 全部命中，source summary 同时固定真实 nf-core、SILVA 与 SEPP 来源边界
      - otutab 为 features × samples 的 366 × 4 非负整数矩阵，总计 5,213 reads；taxonomy 为 366 × 7，metadata 为 4 × 5
