      - 输入 Artifact 为 4 个样本、8,614 对去引物 reads，并通过 maximum validation
      - 同时比较未截断、保留 reverse tail、220/200 主参数、180/150 短截断和 maxEE=1 五个真实执行分支
      - 主参数固定 trunc-len 220/200、trim-left 0/0、maxEE 2/2、trunc-q 2、minimum overlap 12、maximum merge mismatch 0 和单线程
