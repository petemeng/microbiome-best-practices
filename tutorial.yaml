  - id: validate-sepp-phylogeny
    title: 一次性验证第 16 篇 SEPP reference placement 与 rooted phylogeny
    cache_revision: article-16-sepp-gg-13-8-v1
    goal: >
      使用 QIIME 2 官方 Greengenes 13_8 99% SEPP reference Artifact，把第 12 篇
      独立打包的 366 条真实 515F/806R V4 ASV 放入固定 reference backbone。
      固定 alignment subset 1,000、placement subset 5,000 与 8 线程，生成
      Phylogeny[Rooted] 和 Placements，按树尖端过滤聚合频数表，并对 reference
      contents、Artifact、provenance、jplace 候选位置、tip set、branch lengths、
      ASV/read retention 和英文发表图完成机器审计。
    rationale: >
      SEPP 是把短 fragment 放入版本化 reference tree，而不是从短 V4 de novo
      估计深层拓扑。成功生成树不代表所有 placement 唯一或正确，也不保证
      feature table 与 tree tips 对齐；因此必须把 reference contract、relative
      placement support、枝长、rooted status 和过滤损失一起验收。
    inputs:
      - env/qiime2.yml
      - downloads/sepp-refs-gg-13-8.qza
      - data/small/taxonomy-databases/query-v4-asvs.fasta.gz
      - data/small/taxonomy-databases/query-v4-asv-abundance.tsv
      - data/small/taxonomy-databases/query-source-summary.json
      - scripts/validate_sepp_phylogeny.py
    command: |
      set -eu
      mkdir -p \
        "${RUN_ROOT}/results/16-sepp-phylogeny" \
        "${RUN_ROOT}/figures" \
        "${RUN_ROOT}/.cache/matplotlib"
      MPLCONFIGDIR="${RUN_ROOT}/.cache/matplotlib" \
      python3 "${MANIFEST_DIR}/scripts/validate_sepp_phylogeny.py" \
        --project-root "${MANIFEST_DIR}" \
        --reference-database "${RUN_ROOT}/downloads/sepp-refs-gg-13-8.qza" \
        --output-dir "${RUN_ROOT}/results/16-sepp-phylogeny" \
        --figure-dir "${RUN_ROOT}/figures" \
        --qiime-env microbiome-qiime2-2026.4 \
        --threads 8
    expected_outputs:
      - results/16-sepp-phylogeny/sepp-phylogeny-summary.json
      - results/16-sepp-phylogeny/environment-audit.tsv
      - results/16-sepp-phylogeny/reference-database-audit.tsv
