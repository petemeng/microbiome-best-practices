  - id: validate-series-contract
    title: 核对 55 篇目录与单篇自足规则
    cache_revision: articles-01-55-causal-inference-nine-section-v8
    goal: >
      检查编号、文件名、标题、必需章节、随机种子提示和图内英文规则，输出结构验证报告。
    rationale: >
      先把内容蓝图变成可检查的目录契约，才能避免后续章节编号漂移、缺段或网页版与公众号版分叉。
    inputs:
      - tutorial.yaml
      - _quarto.yml
      - index.qmd
      - chapters/*.qmd
    command: |
      set -eu
      mkdir -p results
      python3 "${MANIFEST_DIR}/scripts/validate_series.py" \
        --project-root "${MANIFEST_DIR}" \
        --manifest "${MANIFEST_DIR}/tutorial.yaml" \
        --output "${RUN_ROOT}/results/scaffold_validation.json"
    expected_outputs:
      - results/scaffold_validation.json
    acceptance_checks:
      - 章节编号从 01 到 55 连续且无重复
      - tutorial.yaml 与 _quarto.yml 的章节标题和文件一致
      - 第 01–54 篇保留正式九段结构并含“审计与升级”、完整准备工作、Methods、自有数据迁移和参考文献；第 55 篇使用无代码阅读框架的对应结构
    common_failures:
      - index.qmd 与第 01 篇重复或漏计
      - 中文标题和英文 slug 对不上
      - 样板保留占位数据、元说明或未执行的 Methods 声明
    outputs:
      - results/scaffold_validation.json
    method_basis:
      type: project-experience
      summary: 结构门禁把 55 篇蓝图固定为机器可检查契约，降低长系列维护漂移。
    references:
      - title: Quarto Books documentation
        type: software-documentation
        url: https://quarto.org/docs/books/
    assertions:
      - id: scaffold-validation-exists
        type: file_exists
        path: results/scaffold_validation.json
      - id: scaffold-chapter-count
        type: metric_threshold
        path: results/scaffold_validation.json
        key: chapter_count
        comparator: "=="
        value: 55
  - id: render-pilot-chapters
    title: 实跑并渲染第 01–55 篇
    cache_revision: articles-01-55-causal-inference-rlock-v8
    goal: >
      在隔离的 QA staging 目录中渲染开篇、测量边界、实验设计、污染控制、
      批次效应、FASTQ 数据合同、WSL2/conda 环境合同、QIIME 2 Artifact 验收、
      R 包生态与对象合同、导入/provenance/原始质控、去引物与区域分支、
      DADA2 截断与 ASV 账本、ITS/18S 分支与参考库合同、SILVA/GTDB/Greengenes2
      物种注释与数据库选择、区域 Naive Bayes classifier 训练与阈值验证、
      SEPP reference placement 与 rooted phylogeny、QIIME 2 导出与五组件 phyloseq、
      出版图形与四格式导出合同、Alpha 指数/稀释曲线/Hill numbers、Alpha 组间检验与效应量、
      六类 Beta 距离/根树/零值处理、PCoA、受限置换 PERMANOVA/PERMDISP、CAP
      envfit/Mantel/VPA 方差解构、堆叠/气泡/冲积/热图组成可视化、五级 taxonomy/lineage 组成审计，
      feature-level core microbiome、稀有生物圈与阈值/深度敏感性、raw-count DMM，
      以及 CoDA、五方法 DA 横评、多分类级 DA、差异图形、QMP、共现网络、网络鲁棒性、
      微生物 WGCNA、βNTI/RCbray、中性模型、宏生态 pattern、功能预测、随机森林、
      跨队列 meta/external validation、时间结局、跨组学关联整合、sPLS/DIABLO、
      原生 MMvec/MOFA、多界联合分析、来源追踪、纵向模型、SEM、中介、MR 与因果证据阅读框架五十五篇文章，
      生成 HTML、PDF/SVG/PNG/TIFF 图、统计审计表、Artifact、质控报告和运行日志。
    rationale: >
      五十五篇正式文章只有经过真实数据执行、一次性环境审计或可追溯证据台账审计，
      才能共同形成一致的深度、结构、代码和证据范围标准。
