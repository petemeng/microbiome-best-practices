      - figures/20-pairwise-effect-forest.png
      - figures/20-pairwise-effect-forest.tiff
    acceptance_checks:
      - 四份输入 SHA-256、13,628 features、90 samples、1,619,670 reads、非负整数 counts 与 ID 集合全部通过；不得读取 results/19-alpha-diversity
      - metadata 有 Group、Type、Saline，但没有 SubjectID、PairID 或 Time；设计门禁明确选择 independent three-group 分支，并把 paired/repeated 分支的必需列写入审计表
      - 0.90 coverage Hill q=0/1/2 从三件套独立重算，保留 90 个样本和 270 行结果；56 个样本为 interpolation、34 个为 extrapolation，最大 effort ratio 不超过 1.5
      - 三个主指标分别运行 Kruskal–Wallis；同一主检验族用 Holm 控制 family-wise error，报告 H、df、原始/校正 P 与 epsilon-squared
      - 每个 Hill order 的三个计划成对比较全部输出，共九行；成对 P 在九项检验族内用 Holm 校正，并报告方向固定的 Cliff's delta、probability of superiority 与 5,000 次组内 bootstrap percentile 95% CI
      - 不用 Shapiro–Wilk P 值自动选择主检验；分布诊断只用于解释形状、离群值和“不能简单称为中位数检验”的边界
      - Welch mean-based sensitivity 与 raw/10,000 reads/90% coverage 结论稳定性分别保存，敏感性结果不得反向决定主分析
      - 四张英文原创图各导出 PDF/SVG/600 ppi PNG/LZW-TIFF，并通过物理尺寸、像素、字体、SVG 文本和压缩审计
    common_failures:
      - 把样本当独立重复，却忽略同一受试者、地点、窝、家庭或时间序列
      - 先做正态性检验，再根据哪个方法更显著选择 t test 或 Wilcoxon
      - 把 Kruskal–Wallis 直接写成“中位数检验”，不检查各组分布形状与尺度
      - 只给星号或 P 值，不给效应方向、效应量和置信区间
      - 每个 q 和每个 pair 单独校正，缩小检验族以制造显著结果
      - 用第 19 篇导出的 alpha 表作为隐性输入，破坏单篇自足
      - 用 raw richness 主图比较测序量不同的组，或根据敏感性结果挑标准化方式
      - paired/repeated metadata 缺失时仍运行配对检验或混合模型
