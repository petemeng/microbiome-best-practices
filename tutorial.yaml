environment:
  runtime: host
  pipeline_version: 0.1.0-pilot-v30
  setup:
    - pilot 使用 R 4.4.1，R 包固定在 env/renv.lock
    - Quarto 固定为 1.9.38，并用于第 01–55 篇真实渲染
    - 第 04–05 篇污染与批次诊断固定使用 Bioconductor 3.19、decontam 1.24.0 与 vegan 2.6-6.1
    - env/qiime2.yml 固定 QIIME 2 2026.4；第 07 篇已完成 Linux 执行层审计，第 08 篇已完成真实 FASTQ import、maximum validation、export 回验和报错探针，第 10 篇已完成独立 import、EMP demultiplex、provenance、FastQC 与 MultiQC 验收，第 11 篇已完成 primer-presence、q2-cutadapt、成对保留和区域分支验收，第 12 篇已完成五组 q2-dada2 参数、overlap、逐阶段损失、ASV 长度和 provenance 验收，第 13 篇已通过 env/qiime2-itsxpress-overlay.yml 固定 ITSxpress 2.1.4/Biopython 1.87，并完成真实 ITS2、UNITE build/evaluation 与 PR2 全库审计；第 14 篇已完成 SILVA 138.2、GTDB R232、Greengenes2 2024.09 的完整 source、区域参考、统一 consensus-VSEARCH、maximum validation 与 provenance 审计；第 15 篇已完成 SILVA 138.2 V4 known-lineage holdout、三档 confidence、全参考生产模型、maximum validation 与 provenance 审计；第 16 篇已完成官方 GG13_8 SEPP reference、真实 V4 placement、rooted tree、jplace、feature filtering、maximum validation 与 provenance 审计
    - 第 09 篇固定 R 4.4.1、Bioconductor 3.19、phyloseq 1.48.0、microeco 2.0.0 与 tidyverse 2.0.0，并用真实三件套完成对象双路径验收
    - 第 17 篇固定使用独立 checksum-locked 的 366 × 4 counts、366 × 7 taxonomy、4 × 5 metadata、366 条代表序列和 203,818-tip 完整 SEPP 根树；R 中显式核对方向与 ID、按 ASV 修剪树、构建五组件 phyloseq 1.48.0 对象，并验证 RDS 回读
    - 第 18 篇固定使用 13,628 × 90 的真实湿地三件套、DejaVu Sans、colorspace 2.1.0、ragg 1.3.2、systemfonts 1.1.0 与 svglite 2.1.3；四张原创图同时导出 PDF/SVG/PNG/LZW-TIFF，并按 89/183 mm 最终尺寸与 600 ppi 位图合同审计
    - 第 19 篇固定使用同一真实湿地三件套、vegan 2.6-6.1 与 iNEXT 3.0.2；同时保留 raw alpha、10,000 reads 等样本量标准化和 0.90 等覆盖度标准化，Hill q=0/1/2 均以有效 feature 数解释
    - 第 20 篇不读取第 19 篇结果文件，而从三件套独立重算 0.90 coverage Hill q=0/1/2；元数据设计门禁选择独立三组分支，主检验、效应量、置信区间、多重比较和 raw/10,000 reads/coverage 敏感性均保存为审计表
    - 第 21 篇固定使用 GlobalPatterns 真实 16S 三件套与精确同 tip rooted tree；R 4.4.1/phyloseq 1.48.0 计算 Bray、Jaccard、unweighted/weighted UniFrac 与经典 Aitchison，独立 Python 3.12.13/gemelli 0.0.13 环境计算 observed-only rclr/RPCA Robust Aitchison；同一 feature filter、seed、PC 方向规范化与 12 位写出规则保证可复跑
    - 第 23 篇固定使用 soilrep 的独立三件套；技术标签库按 BiologicalSampleID 聚合，Block/MainPlot/within-plot 三层设计逐项审计；相对丰度 Bray-Curtis 主分析使用 9,999 个 seed-locked split-plot 受限置换，四个预设 simple-effect 比较完整枚举每对 63 个非恒等置换并在同一族内 Holm 校正
    - 第 25 篇固定使用 microeco 2.0.0 的 13,628 × 90 湿地三件套与 11-variable environment 表；5% prevalence 后 11,113 features，envfit/Mantel 使用 relative-abundance Bray-Curtis，VPA 使用 Hellinger matrix；同一 999-row free-permutation matrix 驱动全部主检验，并显式审计 Group/Saline 混杂、共线性、multiplicity 与不可检验 shared fraction
    - 第 26 篇固定使用同一 13,628 × 90 湿地三件套；逐样本闭合后用等样本均值选择门水平 Top 10，Unknown 与 Other 分离；属水平气泡图和热图保留全部 reads 分母，并对 pooled-read weighting、known-only renormalization、Top-N 与七级注释完整性做敏感性审计
    - 第 28 篇固定使用同一 13,628 × 90 湿地三件套；feature-level 主 core 为 relative abundance ≥0.01% 且 prevalence ≥80%，组内 core 均在各自 30 个样本中重算；稀有生物圈主视图使用单样本 0–0.1% local abundance，并把 conditionally rare、persistently rare 与低计数/低 occupancy 的 sampling-limited tail 分开标记
    - 第 29 篇固定使用 DirichletMultinomial 1.46.0 分发的 278 × 130 Holmes Twins 原始 genus counts；DMM 主分支保持整数计数和全部 source categories，k=1–7、seed 20260729、minimum accepted component size 14，外部 BMIClass 仅作描述；package reference fit、八次初始化、5% prevalence、depth ≥1,000、deterministic 1,000-read rarefaction 和每位参与者一份样本均作为稳定性审计，不把离散 state 标签解释为自然类别或疾病亚型
    - 第 30–33 篇固定使用 microeco 2.0.0 的 13,628 × 90 湿地三件套；依次审计 closure/reference frame、五种差异方法的同设计横评、Family/Genus/Species 注释门禁，以及同一主结果表驱动的四类差异图
    - 第 34 篇固定使用 reconsi 1.16.0 分发的 Vandeputte 234 × 135 属级表与 flow-cytometry microbial load；主比较只保留同一 Disease cohort 的 29 个 Crohn's disease 与 66 个 healthy 样本，并用 seed 20260734 的 2,000 次 bootstrap 比较 relative 与 quantitative scale
    - 第 35 篇固定使用同一湿地三件套、40 个 group-blind 预筛属、seed 20260735、SparCC 200 次 bootstrap/permutation 与 SPIEC-EASI MB/StARS 50 次重采样；方法交集与按组中心化 CLR 敏感性均作为边级审计，不把 association 写成 interaction
    - 第 36–40 篇固定使用同一 13,628 × 90 湿地三件套；第 36 篇审计 topology robustness 与 rewiring，第 37 篇固定 WGCNA 1.74，第 38 篇固定 iCAMP 1.5.12 与同源 rooted tree，第 39 篇审计 neutral-model pool/detection/depth，第 40 篇分开报告 sample-use breadth、RAD 与 within-region distance-decay
    - 第 41–45 篇固定 PICRUSt2 2.6.3/ggpicrust2 2.5.17、FAPROTAX 1.2.12、ranger 0.16.0/pROC 1.18.5、metafor 4.6-0 与 timeROC 0.4；PICRUSt2 用 env/picrust2.yml 独立管理
    - 第 46–50 篇固定 HAllA 0.8.40、mixOmics 6.26.0、原生 MMvec 1.0.5/TensorFlow 1.15.0、原生 mofapy2 0.7.4、FEAST 固定 commit 与 SourceTracker2 2.0.1；MMvec legacy runtime、现代 multi-omics runtime 和 SourceTracker2 分别由 env/mmvec-native.yml、env/multiomics.yml 与 env/sourcetracker2.yml 隔离
    - 第 51–54 篇固定 nlme、piecewiseSEM 2.3.0.1、plspm 0.6.0、mediation 4.5.1、emmeans 1.10.2、TwoSampleMR 0.6.6 与 MRPRESSO 1.0；第 55 篇为无统计代码的证据阅读框架；R 依赖与传递依赖统一记录在 418-package env/renv.lock
    - env/raw-qc.yml 固定 FastQC 0.12.1 与 MultiQC 1.33，和 QIIME 2 环境分开管理
  tools:
    - name: Rscript
      version_command: Rscript --version
    - name: python3
      version_command: python3 --version
    - name: quarto
      version_command: quarto --version
literature_review:
  summary: >
    pilot 以第 01 篇证据地图、第 02 篇测量边界、第 03 篇实验设计、第 04 篇污染控制、
    第 05 篇批次效应、第 06 篇 FASTQ 数据合同、第 07 篇 WSL2/conda Linux
    执行层审计、第 08 篇 QIIME 2 真实 Artifact 验收、第 09 篇 R 包与对象合同、
    第 10 篇导入/provenance/原始序列质控、第 11 篇去引物与区域分支、
    第 12 篇 DADA2 截断与 ASV 账本、第 13 篇 ITS/18S 分支与参考库合同、
    第 14 篇 SILVA/GTDB/Greengenes2 区域参考与统一分类合同，
    第 15 篇区域 Naive Bayes classifier 训练、known-lineage 留出与阈值合同，
    第 16 篇 SEPP reference placement 与 rooted phylogeny，
    第 17 篇 QIIME 2 文本导出、ID/方向门禁与五组件 phyloseq 对象，
    第 18 篇出版图形的主题、色觉冗余、字体、最终物理尺寸与四格式导出合同，
    第 19 篇 alpha 指数、稀释曲线、coverage standardization 与 Hill numbers 合同，
    第 20 篇组间设计门禁、Kruskal–Wallis、Holm 校正、Cliff's delta 与 bootstrap 区间合同，
    第 21 篇 Bray/Jaccard/UniFrac/Aitchison/Robust Aitchison 的测量对象、
    metric-specific standardization、rooted-tree 门禁、零值处理与距离几何合同，
    以及 PCoA、CAP 两类排序、第 25 篇 envfit/Mantel/VPA 环境方差解构、第 26 篇群落组成可视化、第 27 篇多分类级组成/lineage 审计与第 28 篇核心菌群/稀有生物圈阈值审计为验收面，结合真实 16S 数据、官方软件文档、
    经典方法论文和微生物组统计边界，
    校正二十八篇正式文章。
    后续每一篇都在写作前锁定公开数据、方法依据
    和可重绘的目标结果，未通过实跑的数值不得写成定论。
  papers:
    - title: "microeco: an R package for data mining in microbial community ecology"
      journal: FEMS Microbiology Ecology
      year: 2021
      relevance: >
        提供 pilot 使用的真实 16S OTU、taxonomy、sample metadata 和环境因子数据，
        同时覆盖排序与环境关联的常用实现。
      citation: Liu C, Cui Y, Li X, Yao M. FEMS Microbiology Ecology. 2021;97(2):fiaa255.
    - title: Soil bacterial community structure in Chinese wetlands
      journal: Geoderma
      year: 2019
      relevance: >
        为第 26 篇提供 90 个 inland、coastal 与 Tibetan wetland 样本及其优势门组成的
        数据与论文锚点；教程从公开三件套重绘，不复制原图或论文数值。
      citation: An J, Liu C, Wang Q, et al. Geoderma. 2019;337:290-299.
    - title: "Microbiome datasets are compositional: and this is not optional"
      journal: Frontiers in Microbiology
      year: 2017
      relevance: >
        为第 26 篇相对丰度闭合、共同分母与不能从组成图推断绝对数量提供方法边界。
      citation: Gloor GB, Macklaim JM, Pawlowsky-Glahn V, Egozcue JJ. Frontiers in Microbiology. 2017;8:2224.
    - title: Population-level analysis of gut microbiome variation
      journal: Science
      year: 2016
      relevance: >
        为第 25 篇提供多协变量与 cumulative non-redundant variation 的论文锚点；
        教程不复制其人群队列数值，而用公开湿地数据重绘并区分三类统计量。
      citation: Falony G, Joossens M, Vieira-Silva S, et al. Science. 2016;352:560-564.
    - title: Variation partitioning of species data matrices - estimation and comparison of fractions
      journal: Ecology
      year: 2006
      relevance: >
        为 adjusted variation fractions、pure/shared fractions 与可检验边界提供方法依据。
      citation: Peres-Neto PR, Legendre P, Dray S, Borcard D. Ecology. 2006;87:2614-2625.
    - title: Dismantling the Mantel tests
      journal: Methods in Ecology and Evolution
      year: 2013
      relevance: >
        支持把 partial Mantel 限定为带警告的敏感性分析，禁止用它确认空间混杂已被排除。
      citation: Guillot G, Rousset F. Methods in Ecology and Evolution. 2013;4:336-344.
    - title: "phyloseq: An R package for reproducible interactive analysis and graphics of microbiome census data"
      journal: PLOS ONE
      year: 2013
      relevance: >
        为第 17 篇提供 otu_table、tax_table、sample_data、phy_tree 与 refseq
        组件的对象模型，以及构建时按 feature/sample 交集保持内部一致性的依据。
      citation: McMurdie PJ, Holmes S. PLOS ONE. 2013;8(4):e61217.
    - title: "colorspace: A Toolbox for Manipulating and Assessing Colors and Palettes"
      journal: Journal of Statistical Software
      year: 2020
      relevance: >
        为第 18 篇的颜色空间处理、对比度计算和 protan/deutan 色觉模拟提供软件与方法依据。
      citation: Zeileis A, Fisher JC, Hornik K, et al. Journal of Statistical Software. 2020;96(1):1-49.
    - title: "Diversity and Evenness: A Unifying Notation and Its Consequences"
      journal: Ecology
      year: 1973
      relevance: >
        为第 19 篇把 richness、Shannon entropy 与 Simpson concentration
        统一为 q=0、1、2 的 Hill numbers，并按有效 feature 数解释。
      citation: Hill MO. Ecology. 1973;54(2):427-432.
    - title: "Coverage-based rarefaction and extrapolation: standardizing samples by completeness rather than size"
      journal: Ecology
      year: 2012
      relevance: >
        为第 19 篇区分等 reads 与等 sample coverage，并把 completeness
        而非测序量作为另一条明确的标准化轴。
      citation: Chao A, Jost L. Ecology. 2012;93(12):2533-2547.
    - title: "Rarefaction and extrapolation with Hill numbers: a framework for sampling and estimation in species diversity studies"
      journal: Ecological Monographs
      year: 2014
